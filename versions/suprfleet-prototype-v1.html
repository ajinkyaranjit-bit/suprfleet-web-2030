<title>SuprFleet 2030 Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap">
<style>
/* Layout: narrow left rail · main working column · optional right Ask panel. Calm porcelain surface, cobalt for actions, serif only for the system's answers. */
:root{
  --paper:#F3F4F1; --surface:#FFFFFF; --sunk:#EEF0EC; --ink:#18212B; --ink2:#4D5966; --ink3:#7A8591; --line:#DDE1DB; --line2:#C9CEC7;
  --accent:#2446C9; --accent-ink:#FFFFFF; --accent-soft:#E8EDFB;
  --money:#11704A; --money-soft:#E3F2EA; --warn:#9A5800; --warn-soft:#FBF0DE; --crit:#B3261E; --crit-soft:#FBE8E6; --stale:#6A6F78; --stale-soft:#ECEDEF;
  --f-ui:"Geist", "Segoe UI", system-ui, sans-serif; --f-say:"Newsreader", Georgia, "Times New Roman", serif;
  --r-s:6px; --r-m:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#12161B; --surface:#1A2027; --sunk:#151A20; --ink:#E9ECEF; --ink2:#AEB6BF; --ink3:#808A95; --line:#2A323B; --line2:#3A434D;
  --accent:#7D97FF; --accent-ink:#0E1424; --accent-soft:#1E2847; --money:#5CC995; --money-soft:#16312A; --warn:#F0B35A; --warn-soft:#352813;
  --crit:#FF8A80; --crit-soft:#3A1A18; --stale:#A2A8B1; --stale-soft:#252B32; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#12161B; --surface:#1A2027; --sunk:#151A20; --ink:#E9ECEF; --ink2:#AEB6BF; --ink3:#808A95; --line:#2A323B; --line2:#3A434D;
  --accent:#7D97FF; --accent-ink:#0E1424; --accent-soft:#1E2847; --money:#5CC995; --money-soft:#16312A; --warn:#F0B35A; --warn-soft:#352813;
  --crit:#FF8A80; --crit-soft:#3A1A18; --stale:#A2A8B1; --stale-soft:#252B32; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font:14px/1.5 var(--f-ui);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:208px minmax(0,1fr);min-height:100%}
.rail{border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;background:var(--paper)}
.brand{font-weight:600;font-size:15px;padding:4px 10px 16px;display:flex;align-items:center;gap:8px}
.brand i{width:18px;height:18px;border-radius:5px;background:var(--ink);display:inline-block;position:relative}
.brand i::after{content:"";position:absolute;inset:5px;border-radius:2px;background:var(--paper)}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px;white-space:nowrap;padding:8px 10px;border-radius:var(--r-s);border:0;background:none;text-align:left;cursor:pointer;color:var(--ink2)}
.nav:hover{background:var(--sunk);color:var(--ink)}
.nav[aria-current="page"]{background:var(--surface);color:var(--ink);font-weight:500;box-shadow:0 0 0 1px var(--line)}
.count{font-size:12px;min-width:20px;text-align:center;padding:0 6px;border-radius:999px;background:var(--warn-soft);color:var(--warn);font-weight:600}
.rail .who{margin-top:auto;padding:10px;font-size:12.5px;color:var(--ink3);border-top:1px solid var(--line)}
.rail .who b{display:block;color:var(--ink);font-weight:500}
.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding:14px 28px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--paper);z-index:5}
.crumbs{display:flex;gap:6px;align-items:center;color:var(--ink3);font-size:13px;min-width:0;flex-wrap:wrap}
.crumbs button{border:0;background:none;padding:0;color:var(--ink2);cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line2)}
.fresh{margin-left:auto;font-size:12.5px;color:var(--ink3);white-space:nowrap}
.fresh.bad{color:var(--warn)}
.askbtn{display:flex;align-items:center;gap:10px;border:1px solid var(--line2);background:var(--surface);border-radius:999px;padding:6px 8px 6px 14px;cursor:pointer;color:var(--ink2);min-width:220px}
.askbtn kbd{font:12px var(--f-ui);border:1px solid var(--line);border-radius:5px;padding:0 6px;color:var(--ink3);margin-left:auto}
.page{padding:26px 28px 120px;max-width:1120px;width:100%;display:flex;flex-direction:column;gap:22px}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
h1{font-size:22px} h2{font-size:17px} h3{font-size:15px}
p{margin:0}
.say{font-family:var(--f-say);font-weight:400;font-size:clamp(24px,2.6vw,32px);line-height:1.2;letter-spacing:-.01em;max-width:30ch;text-wrap:balance}
.say.s{font-size:22px;max-width:40ch}
.muted{color:var(--ink2)} .faint{color:var(--ink3)} .sm{font-size:13px} .xs{font-size:12px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.spread{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
.grid2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px}
@media (max-width:980px){.grid2{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel.flush{padding:0;gap:0}
.panel .ph{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:16px 18px 10px}
.btn{border:1px solid var(--line2);background:var(--surface);border-radius:var(--r-s);padding:8px 14px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--ink3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:none;color:var(--ink2);padding-inline:8px}
.btn.ghost:hover{color:var(--ink);background:var(--sunk)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.link{border:0;background:none;padding:0;color:var(--accent);cursor:pointer;font-weight:500}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;border-radius:999px;padding:2px 9px;white-space:nowrap}
.chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.crit{background:var(--crit-soft);color:var(--crit)} .chip.ok{background:var(--money-soft);color:var(--money)}
.chip.stale{background:var(--stale-soft);color:var(--stale)} .chip.info{background:var(--accent-soft);color:var(--accent)} .chip.line{border:1px solid var(--line2);color:var(--ink2)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}

/* Safety strip */
.urgent{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--crit-soft);border:1px solid color-mix(in srgb,var(--crit) 35%,transparent);border-radius:var(--r-m);padding:12px 16px}
.urgent .ic{width:28px;height:28px;border-radius:50%;background:var(--crit);color:#fff;display:grid;place-items:center;font-weight:700}
@media (max-width:700px){.urgent{grid-template-columns:1fr}}

/* Vitals */
.vitals{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r-m);background:var(--surface)}
.vital{padding:14px 16px;display:flex;flex-direction:column;gap:2px;border-right:1px solid var(--line);min-width:0;text-align:left;background:none;border-top:0;border-bottom:0;border-left:0}
.vital:last-child{border-right:0}
.vital .k{font-size:12.5px;color:var(--ink3)}
.vital .v{font-size:22px;font-weight:600;letter-spacing:-.01em}
.vital .d{font-size:12px;color:var(--ink2)}
.vital.button{cursor:pointer} .vital.button:hover{background:var(--sunk)}
.vital .v small{font-size:14px;color:var(--ink3);font-weight:500}
@media (max-width:900px){.vitals{grid-template-columns:repeat(2,minmax(0,1fr))}.vital{border-bottom:1px solid var(--line)}}

/* Lists */
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;padding:14px 18px;border-top:1px solid var(--line);align-items:center;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.item.button{cursor:pointer} .item.button:hover{background:var(--sunk)}
.item .t{font-weight:500}
.item .m{font-size:13px;color:var(--ink2)}
.item .n{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.item .n b{font-weight:600}
.est{border-bottom:1px dashed currentColor}
.mix{display:flex;height:8px;border-radius:4px;overflow:hidden;gap:2px}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--ink2)}
.legend span{display:inline-flex;gap:6px;align-items:center}

/* Tables */
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{text-align:left;padding:10px 14px;border-top:1px solid var(--line);vertical-align:middle;font-size:13.5px}
th{font-weight:500;color:var(--ink3);font-size:12.5px;border-top:0;padding-top:4px}
tr.out td{color:var(--ink3);text-decoration:line-through;text-decoration-color:var(--line2)}
tr.out td:last-child{text-decoration:none}

/* Money receipt */
.receipt{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 20px;font-size:13.5px}
.receipt .r{text-align:right}
.receipt .tot{font-weight:600;border-top:1px solid var(--line);padding-top:6px}
.figures{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border:1px solid var(--line);border-radius:var(--r-m)}
.fig{padding:12px 14px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px;min-width:0}
.fig:last-child{border-right:0}
.fig .k{font-size:12.5px;color:var(--ink3)}
.fig .v{font-size:20px;font-weight:600}
.fig.pos .v{color:var(--money)}
@media (max-width:800px){.figures{grid-template-columns:repeat(2,minmax(0,1fr))}.fig{border-bottom:1px solid var(--line)}}

/* Evidence ledger: the signature element */
.ledger{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border:1px solid var(--line);border-radius:var(--r-m);background:var(--surface)}
.lcol{padding:16px 18px;display:flex;flex-direction:column;gap:12px;border-right:1px solid var(--line);min-width:0}
.lcol:last-child{border-right:0}
.lcol h3{display:flex;gap:8px;align-items:center}
.ev{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;font-size:13.5px}
.ev .mk{width:18px;height:18px;border-radius:4px;display:grid;place-items:center;font-size:11px;font-weight:700;margin-top:1px}
.mk.sup{background:var(--money-soft);color:var(--money)} .mk.mis{background:var(--stale-soft);color:var(--stale);border:1px dashed var(--stale)} .mk.alt{background:var(--warn-soft);color:var(--warn)}
.ev .src{font-size:12px;color:var(--ink3)}
.weight{display:inline-flex;gap:2px;vertical-align:middle;margin-left:4px}
.weight i{width:6px;height:10px;border-radius:1px;background:var(--line2)}
.weight i.on{background:var(--ink2)}
@media (max-width:900px){.ledger{grid-template-columns:1fr}.lcol{border-right:0;border-bottom:1px solid var(--line)}}

.notice{display:flex;gap:12px;align-items:flex-start;border-radius:var(--r-m);padding:12px 14px;font-size:13.5px}
.notice.info{background:var(--accent-soft)} .notice.ok{background:var(--money-soft)} .notice.warn{background:var(--warn-soft)} .notice.crit{background:var(--crit-soft)} .notice.stale{background:var(--stale-soft)}
.notice b{font-weight:600}

/* Stepper */
.steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0}
.step{display:flex;flex-direction:column;gap:6px;padding-top:12px;border-top:3px solid var(--line);font-size:13px;color:var(--ink3);padding-right:10px}
.step.done{border-color:var(--money);color:var(--ink)}
.step.now{border-color:var(--accent);color:var(--ink)}
.step.fail{border-color:var(--crit);color:var(--ink)}
.step b{font-weight:600;font-size:13.5px}
@media (max-width:760px){.steps{grid-template-columns:1fr 1fr}}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:var(--r-s);overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 12px;cursor:pointer;font-size:13px;color:var(--ink2);border-right:1px solid var(--line2)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}

/* Rule builder */
.rule{font-size:16px;line-height:2.1;max-width:62ch}
.tok{display:inline-block;border:1px solid var(--line2);background:var(--sunk);border-radius:6px;padding:0 8px;line-height:1.7;font-weight:500}
.tok.lock{border-style:dashed;color:var(--ink3);background:none}
.hist{display:grid;grid-template-columns:repeat(26,1fr);gap:3px;align-items:end;height:56px}
.hist i{display:block;border-radius:2px;background:var(--line)}
.hist i.m{background:var(--money)} .hist i.r{background:var(--warn)} .hist i.x{background:var(--stale);opacity:.6}

/* Skeleton */
.sk{background:linear-gradient(90deg,var(--sunk),var(--line),var(--sunk));background-size:200% 100%;animation:sh 1.4s linear infinite;border-radius:6px}
@keyframes sh{to{background-position:-200% 0}}
@media (prefers-reduced-motion: reduce){.sk{animation:none}}

/* Ask panel */
.scrim{position:fixed;inset:0;background:rgba(10,14,20,.28);z-index:20}
.ask{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--surface);border-left:1px solid var(--line);z-index:21;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.ask header{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)}
.ask .body{padding:18px;display:flex;flex-direction:column;gap:14px;overflow:auto;flex:1}
.ask input{width:100%;border:1px solid var(--line2);border-radius:var(--r-s);padding:10px 12px;background:var(--paper);color:var(--ink);font:inherit}
.sugg{display:flex;flex-direction:column;gap:6px}
.sugg button{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-s);padding:9px 12px;cursor:pointer}
.sugg button:hover{border-color:var(--ink3)}
.answer{border:1px solid var(--line);border-radius:var(--r-m);padding:14px;display:flex;flex-direction:column;gap:10px}
.bars{display:flex;flex-direction:column;gap:6px}
.bars div{display:grid;grid-template-columns:120px minmax(0,1fr) 56px;gap:8px;align-items:center;font-size:12.5px}
.bars span.b{height:8px;border-radius:4px;background:var(--accent)}

/* Prototype controls (not product UI) */
.demo{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:15;background:var(--ink);color:var(--paper);border-radius:12px;padding:8px;display:flex;gap:6px;align-items:center;flex-wrap:nowrap;overflow-x:auto;white-space:nowrap;max-width:calc(100% - 24px);box-shadow:0 8px 30px rgba(0,0,0,.18)}
.demo .lbl{font-size:12px;opacity:.7;padding:0 6px}
.demo button{border:0;background:transparent;color:inherit;border-radius:7px;padding:6px 9px;cursor:pointer;font-size:12.5px;opacity:.82}
.demo button:hover{opacity:1;background:rgba(255,255,255,.08)}
.demo button[aria-pressed="true"]{background:var(--paper);color:var(--ink);opacity:1}
.demo select{background:transparent;color:inherit;border:1px solid rgba(255,255,255,.25);border-radius:7px;padding:5px 6px;font:12.5px var(--f-ui)}
.demo select option{color:#111}
.demo .sep{width:1px;height:20px;background:rgba(255,255,255,.2)}

.toast{position:fixed;top:72px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:8px;z-index:30;font-size:13.5px}
.modal{position:fixed;inset:0;display:grid;place-items:center;z-index:25;padding:16px}
.modal .box{background:var(--surface);border-radius:12px;border:1px solid var(--line);max-width:520px;width:100%;padding:20px;display:flex;flex-direction:column;gap:14px}
.radio{display:flex;flex-direction:column;gap:6px}
.radio label{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:var(--r-s);padding:10px 12px;cursor:pointer}
.radio input{margin-top:3px}
textarea{width:100%;min-height:64px;border:1px solid var(--line2);border-radius:var(--r-s);padding:8px 10px;background:var(--paper);color:var(--ink);font:inherit}

@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .rail{position:static;height:auto;flex-direction:row;overflow-x:auto;padding:10px 12px;border-right:0;border-bottom:1px solid var(--line)}
  .brand{padding:4px 8px}
  .rail .who{display:none}
  .top{padding:12px 16px;flex-wrap:wrap}
  .askbtn{min-width:0;flex:1 1 100%;white-space:nowrap}
  .askbtn kbd{display:none}
  .crumbs{flex:1 1 100%}
  .fresh{margin-left:0;white-space:normal}
  .page{padding:20px 16px 160px}
}
</style>

<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.25.6/babel.min.js"></script>
<script type="text/babel" data-presets="react">
const {useState, useEffect, useMemo} = React;

/* ---------- Data (illustrative) ---------- */
const FAIL_COST = 54000;          // ₹38,000 repair + tow + 2 days × ₹8,000 revenue
const P_FAIL = 0.45;              // model likelihood within 90 days (illustrative)
const PARTS = 5000;               // parts + labour per truck
const DOWNTIME = 1000;            // revenue lost in a planned half-day
const TRUCKS = [
  {id:"MH12-RT-4471", route:"Chakan → Nashik", sig:"Strong", seen:"08:31", slot:"Fri 10 Oct, 14:00"},
  {id:"MH04-KL-2210", route:"Bhiwandi → Kasara", sig:"Moderate", seen:"26 h ago", stale:true, slot:"Sat 11 Oct, 09:00"},
  {id:"MH43-BG-9012", route:"Bhiwandi → Nashik", sig:"Strong", seen:"08:36", slot:"Fri 10 Oct, 16:00"},
  {id:"MH12-TQ-1187", route:"Chakan → Bhiwandi", sig:"Strong", seen:"08:38", slot:"Sat 11 Oct, 11:00"},
  {id:"MH15-HX-3301", route:"Nashik → Bhiwandi", sig:"Moderate", seen:"08:12", slot:"Sun 12 Oct, 09:00"},
  {id:"MH04-JP-7754", route:"Bhiwandi → Kasara", sig:"Strong", seen:"08:40", slot:"Sun 12 Oct, 11:00"},
  {id:"MH12-SV-6620", route:"Chakan → Nashik", sig:"Moderate", seen:"08:29", slot:"Mon 13 Oct, 09:00"},
  {id:"MH43-CE-0458", route:"Bhiwandi → Kasara", sig:"Strong", seen:"08:35", slot:"Mon 13 Oct, 11:00"},
  {id:"MH15-NA-2246", route:"Nashik → Chakan", sig:"Strong", seen:"08:22", slot:"Tue 14 Oct, 09:00"},
  {id:"MH04-WD-8890", route:"Bhiwandi → Kasara", sig:"Moderate", seen:"07:58", slot:"Tue 14 Oct, 11:00"},
];
const MIX = [
  {k:"Trucks", n:260, c:"#2446C9"}, {k:"Generators", n:120, c:"#11704A"},
  {k:"Inverters & batteries", n:80, c:"#9A5800"}, {k:"Solar charging stations", n:40, c:"#7A5AB8"},
];
const inr = n => "₹" + Math.round(n).toLocaleString("en-IN");
const lakh = n => "₹" + (n/100000).toFixed(2).replace(/\.?0+$/,"") + " L";

function plan(excluded){
  const n = TRUCKS.filter(t=>!excluded.has(t.id)).length;
  const parts = n*PARTS, down = n*DOWNTIME, cost = parts+down;
  const expected = n*P_FAIL, avoided = expected*FAIL_COST;
  return {n, parts, down, cost, expected, avoided, net: avoided-cost, breakeven: Math.max(1, Math.ceil(cost/FAIL_COST - 1e-9))};
}

/* ---------- Small parts ---------- */
const Chip = ({tone="line", children}) => <span className={"chip "+tone}>{children}</span>;
const Weight = ({n}) => <span className="weight" aria-label={`weight ${n} of 3`}>{[1,2,3].map(i=><i key={i} className={i<=n?"on":""}/>)}</span>;

function Vitals({state, go}){
  const stale = state==="stale";
  const dense = state==="dense";
  const v = [
    {k:"Assets working", v:<>{dense?"402":"431"} <small>/ 500</small></>, d:dense?"72 stopped by flooding":"18 idle, 28 in planned service"},
    {k:"Revenue today, estimated", v:<span className="est">{dense?"₹11.6 L":"₹14.2 L"}</span>, d:dense?"−18% vs a usual Thursday":"+3% vs a usual Thursday"},
    {k:"Needs your decision", v:dense?"7":"3", d:dense?"62 issues, grouped by cause":"1 due Friday", go:"decisions"},
    {k:"Handled by your rules", v:"14", d:"since 18:00 yesterday", go:"activity"},
    {k:"Not reporting", v:stale?"140":"23", d:stale?"Bhiwandi network outage":"14 in low-network corridor", go:"assets"},
  ];
  return <div className="vitals">{v.map((x,i)=>{

      <div className="hist" role="img" aria-label="Weekly timeline: 5 matched your decisions, 1 you rejected, 1 skipped for stale data">{bars.map((b,i)=><i key={i} className={b} style={{height:b?"100%":"20%"}}/>)}</div>
      <div className="legend"><span><i className="dot" style={{background:"var(--money)"}}/>5 match what you approved</span><span><i className="dot" style={{background:"var(--warn)"}}/>1 you rejected</span><span><i className="dot" style={{background:"var(--stale)"}}/>1 skipped: data was stale</span></div>
      <div className="notice warn sm"><span><b>The one you rejected, 2 Jul:</b> those trucks were about to be sold. We've added "not on assets marked for sale" to the rule.</span></div>
      <div className="receipt"><span>Spend it would have booked</span><span className="r">₹2,10,000</span><span>Estimated loss avoided (illustrative)</span><span className="r est">₹8,30,000</span></div>
      <h3 style={{marginTop:6}}>How should it run?</h3>
      <div className="radio">
        <label><input type="radio" name="mode" id="mode-ask" checked={mode==="ask"} onChange={()=>setMode("ask")}/><span><b>Ask me first.</b> <span className="muted">It prepares the booking; you approve in one tap.</span></span></label>
        <label><input type="radio" name="mode" id="mode-act" checked={mode==="act"} onChange={()=>setMode("act")}/><span><b>Book it and tell me.</b> <span className="muted">You can cancel until the vendor confirms (about 2 hours). Requires the Delegate plan.</span></span></label>
      </div>
      <div className="row"><button className="btn primary" disabled={!mode} onClick={()=>{toast(mode==="ask"?"Rule on: it will ask you first.":"Rule on: it will book and tell you."); go("rules")}}>Turn on rule</button><button className="btn ghost" onClick={()=>go("rules")}>Save as draft</button></div>
    </div>}
  </div>;
}

function Decisions({state, go, excluded}){
  const dense = state==="dense"; const p = plan(excluded);
  return <div className="page">
    <div className="spread"><div className="col" style={{gap:6}}><h1>Needs your decision</h1><p className="muted">{dense?"62 issues today, grouped into 7 causes. Safety first, then by money at stake.":"Safety first, then by money at stake and deadline."}</p></div></div>
    <div className="urgent"><span className="ic" aria-hidden="true">!</span><div><b>Suspected fuel theft, MH12-AB-1234.</b> <span className="muted">With Sunita Rao, Safety lead.</span></div><button className="btn sm" onClick={()=>go("theft")}>Review evidence</button></div>
    <div className="panel flush">{(dense?DENSE_GROUPS:liveDecisions(p)).map((d,i)=>
      <button key={i} className="item button" onClick={()=>go(d.to||"proposal")}><div><div className="t">{d.t}</div><div className="m">{d.m}</div></div><div className="n"><b className={d.pos?"est":""}>{d.v}</b><span className="faint xs">{d.when}</span></div></button>)}</div>
  </div>;
}

function Theft({go}){
  return <div className="page">
    <div className="col" style={{gap:8}}><div className="row"><Chip tone="crit">Urgent · safety</Chip><span className="faint sm">Escalated 02:12 to Sunita Rao</span></div>
      <h1>Suspected fuel theft, MH12-AB-1234</h1>
      <p className="muted" style={{maxWidth:"70ch"}}>Safety and theft cases always come before cost proposals. SuprFleet doesn't take vehicle-control actions on its own; a person reviews first.</p></div>
    <div className="ledger">
      <div className="lcol"><h3>What supports it</h3>
        <div className="ev"><span className="mk sup">+</span><div>Fuel level dropped 40 L in 6 minutes <Weight n={3}/><div className="src">Fuel sensor · 02:04–02:10</div></div></div>
        <div className="ev"><span className="mk sup">+</span><div>Engine off, truck stationary at an unlisted lay-by <Weight n={2}/><div className="src">Trip data</div></div></div>
        <div className="ev"><span className="mk sup">+</span><div>Tank cap sensor opened at 02:03 <Weight n={2}/><div className="src">Accessory sensor</div></div></div></div>
      <div className="lcol"><h3>What we couldn't see</h3>
        <div className="ev"><span className="mk mis">?</span><div>Cab camera offline since 23:50<div className="src">Missing source</div></div></div>
        <div className="ev"><span className="mk mis">?</span><div>No fuel card transaction to compare against<div className="src">Missing source</div></div></div></div>
      <div className="lcol"><h3>Other explanations</h3>
        <div className="ev"><span className="mk alt">~</span><div><b style={{fontWeight:500}}>Refuel at an unlisted pump.</b> Unlikely: fuel went down, not up.</div></div>
        <div className="ev"><span className="mk alt">~</span><div><b style={{fontWeight:500}}>Sensor glitch.</b> Possible: this sensor glitched once in August. Level hasn't recovered, which argues against it.</div></div></div>
    </div>
    <div className="row"><button className="btn primary">Call the operator</button><button className="btn">Add a note for Sunita</button><button className="btn ghost">Mark as false alarm</button></div>
    <p className="faint xs">Vehicle-control actions (like immobilising) are outside this prototype.</p>
  </div>;
}

function Simple({title, children}){ return <div className="page"><h1>{title}</h1>{children}</div>; }
function Assets(){
  return <Simple title="Assets">
    <div className="panel"><div className="mix">{MIX.map(m=><span key={m.k} style={{flex:m.n,background:m.c}}/>)}</div><div className="legend">{MIX.map(m=><span key={m.k}><i className="dot" style={{background:m.c}}/>{m.k} {m.n}</span>)}</div></div>
    <div className="panel flush"><div className="ph"><h2>Not reporting</h2><span className="faint sm">23</span></div>
      {[["14 trucks","Kasara ghat low-network corridor","Will sync on return"],["6 generators","Nashik site power cut since 04:00","Check after power returns"],["3 devices","No data for 2 days","Field visit needed"]].map((r,i)=><div key={i} className="item"><div><div className="t">{r[0]}</div><div className="m">{r[1]}</div></div><div className="n"><span className="sm muted">{r[2]}</span></div></div>)}</div>
    <p className="faint sm">Asset detail pages are outside this prototype.</p></Simple>;
}
function Rules(){
  return <Simple title="Automation rules">
    <p className="muted">What SuprFleet can do on its own, and its limits. Safety cases and anything over ₹50,000 always come to you.</p>
    <div className="panel flush">{[["Book panel cleaning under ₹5,000","Solar stations · books and tells you","On"],["Notify operators idling over 45 min","Trucks · no cost","On"],["Raise tickets for temperature alerts","Inverters · no cost","On"],["Clutch and brake service under ₹50,000","Trucks · draft, tested on 6 months","Draft"]].map((r,i)=><div key={i} className="item"><div><div className="t">{r[0]}</div><div className="m">{r[1]}</div></div><div className="n"><Chip tone={r[2]==="On"?"ok":"line"}>{r[2]}</Chip></div></div>)}</div>
    <div className="panel"><h2>Your limits</h2><div className="receipt"><span>You can approve up to</span><span className="r">₹50,000</span><span>Rahul Patil (Maintenance) up to</span><span className="r">₹10,000</span><span>Rules can spend up to, per action</span><span className="r">₹5,000</span><span>Urgent issues at night go to</span><span className="r">Sunita Rao, then you</span></div></div>
  </Simple>;
}
function Activity(){
  return <Simple title="Activity">
    <p className="muted">Everything people and rules did, with the reason.</p>
    <div className="panel flush">{[["02:12","Rule","Escalated suspected fuel theft to Sunita Rao","Safety cases always go to a person"],["21:40","Rule","Told 4 operators about idling","Rule: idling over 45 min"],["20:05","Rule","Booked panel cleaning SOL-07, ₹1,800","Rule: cleaning under ₹5,000"],["18:30","Rahul Patil","Raised ticket for INV-022","Temperature above limit"],["17:10","You","Excluded MH12-RT-4471 from a proposal","Clutch replaced at an outside garage"]].map((r,i)=><div key={i} className="item"><div><div className="t">{r[2]}</div><div className="m">{r[1]} · {r[3]}</div></div><div className="n"><span className="faint sm">{r[0]}</span></div></div>)}</div></Simple>;
}

/* ---------- Ask layer ---------- */
function Ask({close}){
  const [a, setA] = useState(null);
  const Q = ["Why these 10 trucks and not the other 18 of this model?","Why is fuel cost up 8% this month?","Which site lost the most revenue this week?"];
  return <><div className="scrim" onClick={close}/>
  <aside className="ask" aria-label="Ask about your fleet">
    <header><h2>Ask about your fleet</h2><button className="btn ghost sm" onClick={close}>Close</button></header>
    <div className="body">
      <input id="ask-input" placeholder="Ask a question in your words" onKeyDown={e=>{if(e.key==="Enter") setA(1)}}/>
      {!a && <div className="sugg"><span className="faint xs">Suggested from today's issues</span>{Q.map((q,i)=><button key={i} onClick={()=>setA(i===0?0:1)}>{q}</button>)}</div>}
      {a===0 && <div className="answer">
        <span className="faint xs">Answer · based on 28 Tata Signa 4825 trucks, last 30 days</span>
        <p className="say s">The other 18 don't show the slip pattern yet. Most run flat routes with lighter loads.</p>
        <div className="bars">
          <div><span>These 10</span><span className="b" style={{width:"100%"}}/><span>3.2×</span></div>
          <div><span>Other 18</span><span className="b" style={{width:"34%",background:"var(--ink3)"}}/><span>1.1×</span></div>
        </div>
        <p className="faint xs">Slip events vs each truck's own baseline. Sources: vehicle data, trip data.</p>
        <div className="row"><button className="btn sm" onClick={close}>Back to the proposal</button><button className="btn sm ghost">Watch the other 18</button></div>
      </div>}
      {a===1 && <div className="answer">
        <span className="faint xs">Answer · all trucks, Sep vs Aug</span>
        <p className="say s">Most of the 8% is idling at Bhiwandi while vans wait for loading.</p>
        <div className="bars">
          <div><span>Idling, Bhiwandi</span><span className="b" style={{width:"62%"}}/><span>62%</span></div>
          <div><span>Ghat route loads</span><span className="b" style={{width:"23%"}}/><span>23%</span></div>
          <div><span>Diesel price</span><span className="b" style={{width:"15%"}}/><span>15%</span></div>
        </div>
        <div className="row"><button className="btn sm primary">Propose a later start at Bhiwandi</button><button className="btn sm ghost" onClick={()=>setA(null)}>Ask something else</button></div>
      </div>}
    </div>
  </aside></>;
}

/* ---------- App ---------- */
const STORY = [["today","1 Today"],["proposal","2 Proposal"],["evidence","3 Evidence"],["review","4 Approve"],["track","5 Track"],["rule","6 Automation"]];
const NAV = [["today","Today"],["decisions","Needs your decision"],["assets","Assets"],["rules","Automation rules"],["activity","Activity"]];
const TITLES = {today:"Today",proposal:"Proposal",evidence:"Evidence",review:"Review and approve",track:"Clutch service",rule:"New automation rule",decisions:"Needs your decision",assets:"Assets",rules:"Automation rules",activity:"Activity",theft:"Urgent case"};
const PARENT = {proposal:"decisions",evidence:"proposal",review:"proposal",track:"decisions",rule:"rules",theft:"decisions"};

function App(){
  const [screen, setScreen] = useState("today");
  const [state, setState] = useState("normal");
  const [excluded, setExcluded] = useState(new Set());
  const [askOpen, setAskOpen] = useState(false);
  const [modal, setModal] = useState(null);
  const [toastMsg, setToastMsg] = useState(null);
  const [when, setWhen] = useState("now");
  const [failed, setFailed] = useState(true);
  const [reason, setReason] = useState("serviced");

  useEffect(()=>{ const k=e=>{ if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){e.preventDefault();setAskOpen(true)} if(e.key==="Escape"){setAskOpen(false);setModal(null)} }; window.addEventListener("keydown",k); return ()=>window.removeEventListener("keydown",k)},[]);
  useEffect(()=>{ if(!toastMsg) return; const t=setTimeout(()=>setToastMsg(null),3200); return ()=>clearTimeout(t)},[toastMsg]);
  useEffect(()=>{ if(state==="failed"){setWhen("d4");setFailed(true)} },[state]);

  const go = (to)=>{
    if(to==="ask") return setAskOpen(true);
    if(to==="notnow") return setModal({type:"notnow"});
    if(to.startsWith("exclude:")) return setModal({type:"exclude", id:to.split(":")[1]});
    setScreen(to); window.scrollTo({top:0});
  };
  const toast = m=>setToastMsg(m);
  const approve = ()=>{ setWhen("now"); setScreen("track"); toast("Approved. Rahul Patil is confirming slots with the vendor."); window.scrollTo({top:0}); };
  const dataBad = state==="stale";
  const navKey = PARENT[screen] && !NAV.find(n=>n[0]===screen) ? PARENT[screen] : screen;

  let body;
  if(screen==="today") body=<Today state={state} go={go} excluded={excluded} toast={toast}/>;
  else if(screen==="proposal") body=<Proposal excluded={excluded} setExcluded={setExcluded} go={go} openAsk={()=>setAskOpen(true)}/>;
  else if(screen==="evidence") body=<Evidence excluded={excluded} go={go} openAsk={()=>setAskOpen(true)}/>;
  else if(screen==="review") body=<Review excluded={excluded} go={go} approve={approve}/>;
  else if(screen==="track") body=<Track excluded={excluded} go={go} when={when} setWhen={setWhen} failed={failed} setFailed={setFailed} toast={toast}/>;
  else if(screen==="rule") body=<RuleScreen go={go} toast={toast}/>;
  else if(screen==="decisions") body=<Decisions state={state} go={go} excluded={excluded}/>;
  else if(screen==="theft") body=<Theft go={go}/>;
  else if(screen==="assets") body=<Assets/>;
  else if(screen==="rules") body=<Rules/>;
  else body=<Activity/>;

  return <div className="app">
    <nav className="rail" aria-label="Main">
      <div className="brand"><i/>SuprFleet</div>
      {NAV.map(([k,l])=><button key={k} className="nav" aria-current={navKey===k?"page":undefined} onClick={()=>go(k)}>{l}{k==="decisions" && <span className="count">{state==="dense"?7:3}</span>}</button>)}
      <div className="who"><b>Vikram Deshmukh</b>Head of Operations<br/>500 assets · 4 sites</div>
    </nav>
    <div className="main">
      <div className="top">
        <div className="crumbs">{PARENT[screen] && <><button onClick={()=>go(PARENT[screen])}>{TITLES[PARENT[screen]]}</button><span>/</span></>}<span style={{color:"var(--ink)"}}>{TITLES[screen]}</span></div>
        <span className={"fresh"+(dataBad?" bad":"")}>{dataBad?"140 assets 3 h behind":state==="empty"?"Connecting…":"Updated 08:40 · 477 of 500 reporting"}</span>
        <button className="askbtn" onClick={()=>setAskOpen(true)}>Ask about your fleet<kbd>⌘K</kbd></button>
      </div>
      {body}
    </div>

    {askOpen && <Ask close={()=>setAskOpen(false)}/>}

    {modal && <div className="modal" role="dialog" aria-modal="true"><div className="scrim" onClick={()=>setModal(null)}/>
      <div className="box" style={{position:"relative",zIndex:26}}>
        {modal.type==="exclude" ? <>
          <h2>Exclude {modal.id}?</h2>
          <p className="muted sm">Tell us why. It updates this plan and teaches the model.</p>
          <div className="radio">
            {[["serviced","Clutch was serviced recently at an outside garage"],["sale","Truck is about to be sold or retired"],["other","Something else"]].map(([v,l])=><label key={v}><input type="radio" name="reason" id={"reason-"+v} checked={reason===v} onChange={()=>setReason(v)}/><span>{l}</span></label>)}
          </div>
          {reason==="other" && <textarea id="reason-text" placeholder="What should we know?"/>}
          <div className="row"><button className="btn primary" onClick={()=>{const s=new Set(excluded); s.add(modal.id); setExcluded(s); setModal(null); toast("Plan updated: "+plan(s).n+" trucks, est. net "+lakh(plan(s).net)+".")}}>Exclude and update plan</button><button className="btn ghost" onClick={()=>setModal(null)}>Keep it in</button></div>
        </> : <>
          <h2>Not now</h2>
          <p className="muted sm">If you wait, the quiet slots this week are lost. We'll bring it back with fresh data.</p>
          <div className="radio">
            <label><input type="radio" name="nn" id="nn-week" defaultChecked/><span>Remind me next Monday</span></label>
            <label><input type="radio" name="nn" id="nn-disagree"/><span>I disagree with this proposal (tell us why)</span></label>
          </div>
          <div className="row"><button className="btn primary" onClick={()=>{setModal(null); toast("We'll bring this back on Monday 13 Oct.")}}>Confirm</button><button className="btn ghost" onClick={()=>setModal(null)}>Cancel</button></div>
        </>}
      </div></div>}

    {toastMsg && <div className="toast" role="status">{toastMsg}</div>}

    <div className="demo" aria-label="Prototype controls">
      <span className="lbl">Story</span>
      {STORY.map(([k,l])=><button key={k} aria-pressed={screen===k} onClick={()=>{ if(k==="track"){setWhen("now")} go(k)}}>{l}</button>)}
      <span className="sep"/>
      <span className="lbl">State</span>
      <select id="demo-state" value={state} onChange={e=>{setState(e.target.value); setScreen(e.target.value==="failed"?"track":"today")}} aria-label="Demo state">
        <option value="normal">Normal day</option><option value="loading">Loading</option><option value="empty">New account</option>
        <option value="stale">Stale data</option><option value="failed">Action failed</option><option value="dense">Dense day (500 assets)</option>
      </select>
    </div>
  </div>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
