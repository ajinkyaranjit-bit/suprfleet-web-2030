<title>SuprFleet 2030 Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap">
<style>
/* Layout: narrow left rail · main working column · optional right Ask panel. Calm porcelain surface, cobalt for actions, serif only for the system's answers. */
:root{
  --paper:#F3F4F1; --surface:#FFFFFF; --sunk:#EEF0EC; --ink:#18212B; --ink2:#4D5966; --ink3:#7A8591; --line:#DDE1DB; --line2:#C9CEC7;
  --accent:#2446C9; --accent-ink:#FFFFFF; --accent-soft:#E8EDFB;
  --money:#11704A; --money-soft:#E3F2EA; --warn:#9A5800; --warn-soft:#FBF0DE; --crit:#B3261E; --crit-soft:#FBE8E6; --stale:#6A6F78; --stale-soft:#ECEDEF;
  --f-ui:"Geist", "Segoe UI", system-ui, sans-serif; --f-say:"Newsreader", Georgia, "Times New Roman", serif;
  --r-s:6px; --r-m:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#12161B; --surface:#1A2027; --sunk:#151A20; --ink:#E9ECEF; --ink2:#AEB6BF; --ink3:#808A95; --line:#2A323B; --line2:#3A434D;
  --accent:#7D97FF; --accent-ink:#0E1424; --accent-soft:#1E2847; --money:#5CC995; --money-soft:#16312A; --warn:#F0B35A; --warn-soft:#352813;
  --crit:#FF8A80; --crit-soft:#3A1A18; --stale:#A2A8B1; --stale-soft:#252B32; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#12161B; --surface:#1A2027; --sunk:#151A20; --ink:#E9ECEF; --ink2:#AEB6BF; --ink3:#808A95; --line:#2A323B; --line2:#3A434D;
  --accent:#7D97FF; --accent-ink:#0E1424; --accent-soft:#1E2847; --money:#5CC995; --money-soft:#16312A; --warn:#F0B35A; --warn-soft:#352813;
  --crit:#FF8A80; --crit-soft:#3A1A18; --stale:#A2A8B1; --stale-soft:#252B32; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font:14px/1.5 var(--f-ui);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:208px minmax(0,1fr);min-height:100%}
.rail{border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;background:var(--paper)}
.brand{font-weight:600;font-size:15px;padding:4px 10px 16px;display:flex;align-items:center;gap:8px}
.brand i{width:18px;height:18px;border-radius:5px;background:var(--ink);display:inline-block;position:relative}
.brand i::after{content:"";position:absolute;inset:5px;border-radius:2px;background:var(--paper)}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px;white-space:nowrap;padding:8px 10px;border-radius:var(--r-s);border:0;background:none;text-align:left;cursor:pointer;color:var(--ink2)}
.nav:hover{background:var(--sunk);color:var(--ink)}
.nav[aria-current="page"]{background:var(--surface);color:var(--ink);font-weight:500;box-shadow:0 0 0 1px var(--line)}
.count{font-size:12px;min-width:20px;text-align:center;padding:0 6px;border-radius:999px;background:var(--warn-soft);color:var(--warn);font-weight:600}
.rail .who{margin-top:auto;padding:10px;font-size:12.5px;color:var(--ink3);border-top:1px solid var(--line)}
.rail .who b{display:block;color:var(--ink);font-weight:500}
.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding:14px 28px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--paper);z-index:5}
.crumbs{display:flex;gap:6px;align-items:center;color:var(--ink3);font-size:13px;min-width:0;flex-wrap:wrap}
.crumbs button{border:0;background:none;padding:0;color:var(--ink2);cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line2)}
.fresh{margin-left:auto;font-size:12.5px;color:var(--ink3);white-space:nowrap}
.fresh.bad{color:var(--warn)}
.askbtn{display:flex;align-items:center;gap:10px;border:1px solid var(--line2);background:var(--surface);border-radius:999px;padding:6px 8px 6px 14px;cursor:pointer;color:var(--ink2);min-width:220px}
.askbtn kbd{font:12px var(--f-ui);border:1px solid var(--line);border-radius:5px;padding:0 6px;color:var(--ink3);margin-left:auto}
.page{padding:26px 28px 120px;max-width:1120px;width:100%;display:flex;flex-direction:column;gap:22px}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
h1{font-size:22px} h2{font-size:17px} h3{font-size:15px}
p{margin:0}
.say{font-family:var(--f-say);font-weight:400;font-size:clamp(24px,2.6vw,32px);line-height:1.2;letter-spacing:-.01em;max-width:30ch;text-wrap:balance}
.say.s{font-size:22px;max-width:40ch}
.muted{color:var(--ink2)} .faint{color:var(--ink3)} .sm{font-size:13px} .xs{font-size:12px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.spread{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
.grid2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px}
@media (max-width:980px){.grid2{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel.flush{padding:0;gap:0}
.panel .ph{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:16px 18px 10px}
.btn{border:1px solid var(--line2);background:var(--surface);border-radius:var(--r-s);padding:8px 14px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--ink3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:none;color:var(--ink2);padding-inline:8px}
.btn.ghost:hover{color:var(--ink);background:var(--sunk)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.link{border:0;background:none;padding:0;color:var(--accent);cursor:pointer;font-weight:500}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;border-radius:999px;padding:2px 9px;white-space:nowrap}
.chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.crit{background:var(--crit-soft);color:var(--crit)} .chip.ok{background:var(--money-soft);color:var(--money)}
.chip.stale{background:var(--stale-soft);color:var(--stale)} .chip.info{background:var(--accent-soft);color:var(--accent)} .chip.line{border:1px solid var(--line2);color:var(--ink2)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}

/* Safety strip */
.urgent{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--crit-soft);border:1px solid color-mix(in srgb,var(--crit) 35%,transparent);border-radius:var(--r-m);padding:12px 16px}
.urgent .ic{width:28px;height:28px;border-radius:50%;background:var(--crit);color:#fff;display:grid;place-items:center;font-weight:700}
@media (max-width:700px){.urgent{grid-template-columns:1fr}}

/* Vitals */
.vitals{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r-m);background:var(--surface)}
.vital{padding:14px 16px;display:flex;flex-direction:column;gap:2px;border-right:1px solid var(--line);min-width:0;text-align:left;background:none;border-top:0;border-bottom:0;border-left:0}
.vital:last-child{border-right:0}
.vital .k{font-size:12.5px;color:var(--ink3)}
.vital .v{font-size:22px;font-weight:600;letter-spacing:-.01em}
.vital .d{font-size:12px;color:var(--ink2)}
.vital.button{cursor:pointer} .vital.button:hover{background:var(--sunk)}
.vital .v small{font-size:14px;color:var(--ink3);font-weight:500}
@media (max-width:900px){.vitals{grid-template-columns:repeat(2,minmax(0,1fr))}.vital{border-bottom:1px solid var(--line)}}

/* Lists */
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;padding:14px 18px;border-top:1px solid var(--line);align-items:center;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.item.button{cursor:pointer} .item.button:hover{background:var(--sunk)}
.item .t{font-weight:500}
.item .m{font-size:13px;color:var(--ink2)}
.item .n{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.item .n b{font-weight:600}
.est{border-bottom:1px dashed currentColor}
.mix{display:flex;height:8px;border-radius:4px;overflow:hidden;gap:2px}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--ink2)}
.legend span{display:inline-flex;gap:6px;align-items:center}

/* Tables */
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{text-align:left;padding:10px 14px;border-top:1px solid var(--line);vertical-align:middle;font-size:13.5px}
th{font-weight:500;color:var(--ink3);font-size:12.5px;border-top:0;padding-top:4px}
tr.out td{color:var(--ink3);text-decoration:line-through;text-decoration-color:var(--line2)}
tr.out td:last-child{text-decoration:none}

/* Money receipt */
.receipt{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 20px;font-size:13.5px}
.receipt .r{text-align:right}
.receipt .tot{font-weight:600;border-top:1px solid var(--line);padding-top:6px}
.figures{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border:1px solid var(--line);border-radius:var(--r-m)}
.fig{padding:12px 14px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px;min-width:0}
.fig:last-child{border-right:0}
.fig .k{font-size:12.5px;color:var(--ink3)}
.fig .v{font-size:20px;font-weight:600}
.fig.pos .v{color:var(--money)}
@media (max-width:800px){.figures{grid-template-columns:repeat(2,minmax(0,1fr))}.fig{border-bottom:1px solid var(--line)}}

/* Evidence ledger: the signature element */
.ledger{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border:1px solid var(--line);border-radius:var(--r-m);background:var(--surface)}
.lcol{padding:16px 18px;display:flex;flex-direction:column;gap:12px;border-right:1px solid var(--line);min-width:0}
.lcol:last-child{border-right:0}
.lcol h3{display:flex;gap:8px;align-items:center}
.ev{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;font-size:13.5px}
.ev .mk{width:18px;height:18px;border-radius:4px;display:grid;place-items:center;font-size:11px;font-weight:700;margin-top:1px}
.mk.sup{background:var(--money-soft);color:var(--money)} .mk.mis{background:var(--stale-soft);color:var(--stale);border:1px dashed var(--stale)} .mk.alt{background:var(--warn-soft);color:var(--warn)}
.ev .src{font-size:12px;color:var(--ink3)}
.weight{display:inline-flex;gap:2px;vertical-align:middle;margin-left:4px}
.weight i{width:6px;height:10px;border-radius:1px;background:var(--line2)}
.weight i.on{background:var(--ink2)}
@media (max-width:900px){.ledger{grid-template-columns:1fr}.lcol{border-right:0;border-bottom:1px solid var(--line)}}

.notice{display:flex;gap:12px;align-items:flex-start;border-radius:var(--r-m);padding:12px 14px;font-size:13.5px}
.notice.info{background:var(--accent-soft)} .notice.ok{background:var(--money-soft)} .notice.warn{background:var(--warn-soft)} .notice.crit{background:var(--crit-soft)} .notice.stale{background:var(--stale-soft)}
.notice b{font-weight:600}

/* Stepper */
.steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0}
.step{display:flex;flex-direction:column;gap:6px;padding-top:12px;border-top:3px solid var(--line);font-size:13px;color:var(--ink3);padding-right:10px}
.step.done{border-color:var(--money);color:var(--ink)}
.step.now{border-color:var(--accent);color:var(--ink)}
.step.fail{border-color:var(--crit);color:var(--ink)}
.step b{font-weight:600;font-size:13.5px}
@media (max-width:760px){.steps{grid-template-columns:1fr 1fr}}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:var(--r-s);overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 12px;cursor:pointer;font-size:13px;color:var(--ink2);border-right:1px solid var(--line2)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}

/* Rule builder */
.rule{font-size:16px;line-height:2.1;max-width:62ch}
.tok{display:inline-block;border:1px solid var(--line2);background:var(--sunk);border-radius:6px;padding:0 8px;line-height:1.7;font-weight:500}
.tok.lock{border-style:dashed;color:var(--ink3);background:none}
.hist{display:grid;grid-template-columns:repeat(26,1fr);gap:3px;align-items:end;height:56px}
.hist i{display:block;border-radius:2px;background:var(--line)}
.hist i.m{background:var(--money)} .hist i.r{background:var(--warn)} .hist i.x{background:var(--stale);opacity:.6}

/* Skeleton */
.sk{background:linear-gradient(90deg,var(--sunk),var(--line),var(--sunk));background-size:200% 100%;animation:sh 1.4s linear infinite;border-radius:6px}
@keyframes sh{to{background-position:-200% 0}}
@media (prefers-reduced-motion: reduce){.sk{animation:none}}

/* Ask panel */
.scrim{position:fixed;inset:0;background:rgba(10,14,20,.28);z-index:20}
.ask{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--surface);border-left:1px solid var(--line);z-index:21;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.ask header{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)}
.ask .body{padding:18px;display:flex;flex-direction:column;gap:14px;overflow:auto;flex:1}
.ask input{width:100%;border:1px solid var(--line2);border-radius:var(--r-s);padding:10px 12px;background:var(--paper);color:var(--ink);font:inherit}
.sugg{display:flex;flex-direction:column;gap:6px}
.sugg button{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-s);padding:9px 12px;cursor:pointer}
.sugg button:hover{border-color:var(--ink3)}
.answer{border:1px solid var(--line);border-radius:var(--r-m);padding:14px;display:flex;flex-direction:column;gap:10px}
.bars{display:flex;flex-direction:column;gap:6px}
.bars div{display:grid;grid-template-columns:120px minmax(0,1fr) 56px;gap:8px;align-items:center;font-size:12.5px}
.bars span.b{height:8px;border-radius:4px;background:var(--accent)}

/* Prototype controls (not product UI) */
.demo{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:15;background:var(--ink);color:var(--paper);border-radius:12px;padding:8px;display:flex;gap:6px;align-items:center;flex-wrap:nowrap;overflow-x:auto;white-space:nowrap;max-width:calc(100% - 24px);box-shadow:0 8px 30px rgba(0,0,0,.18)}
.demo .lbl{font-size:12px;opacity:.7;padding:0 6px}
.demo button{border:0;background:transparent;color:inherit;border-radius:7px;padding:6px 9px;cursor:pointer;font-size:12.5px;opacity:.82}
.demo button:hover{opacity:1;background:rgba(255,255,255,.08)}
.demo button[aria-pressed="true"]{background:var(--paper);color:var(--ink);opacity:1}
.demo select{background:transparent;color:inherit;border:1px solid rgba(255,255,255,.25);border-radius:7px;padding:5px 6px;font:12.5px var(--f-ui)}
.demo select option{color:#111}
.demo .sep{width:1px;height:20px;background:rgba(255,255,255,.2)}

.toast{position:fixed;top:72px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:8px;z-index:30;font-size:13.5px}
.modal{position:fixed;inset:0;display:grid;place-items:center;z-index:25;padding:16px}
.modal .box{background:var(--surface);border-radius:12px;border:1px solid var(--line);max-width:520px;width:100%;padding:20px;display:flex;flex-direction:column;gap:14px}
.radio{display:flex;flex-direction:column;gap:6px}
.radio label{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:var(--r-s);padding:10px 12px;cursor:pointer}
.radio input{margin-top:3px}
textarea{width:100%;min-height:64px;border:1px solid var(--line2);border-radius:var(--r-s);padding:8px 10px;background:var(--paper);color:var(--ink);font:inherit}

@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .rail{position:static;height:auto;flex-direction:row;overflow-x:auto;padding:10px 12px;border-right:0;border-bottom:1px solid var(--line)}
  .brand{padding:4px 8px}
  .rail .who{display:none}
  .top{padding:12px 16px;flex-wrap:wrap}
  .askbtn{min-width:0;flex:1 1 100%;white-space:nowrap}
  .askbtn kbd{display:none}
  .crumbs{flex:1 1 100%}
  .fresh{margin-left:0;white-space:normal}
  .page{padding:20px 16px 160px}
}
</style>

<style>
/* v2 additions: morning readiness, cases, handover, honest states */
.grid2{align-items:start}
.head{display:flex;flex-direction:column;gap:10px}
.head .when{font-size:13px;color:var(--ink2)}
.head .sub{color:var(--ink2);max-width:68ch}
.ready{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:18px;display:flex;flex-direction:column;gap:16px}
.rrow{display:grid;grid-template-columns:170px minmax(0,1fr) auto;gap:16px;align-items:center}
.rrow .lbl b{display:block;font-weight:600}
.rrow .lbl span{font-size:12.5px;color:var(--ink3)}
.rbar{display:flex;height:12px;gap:2px;border-radius:4px;overflow:hidden;background:var(--surface)}
.rbar span{display:block;height:100%}
.rcounts{display:flex;gap:16px;font-size:13px;white-space:nowrap}
.rcounts span{display:inline-flex;gap:6px;align-items:center}
.rcounts b{font-weight:600}
.sw{width:10px;height:10px;border-radius:2px;display:inline-block}
.sw.r{background:var(--money)} .sw.a{background:var(--warn)} .sw.u{background:repeating-linear-gradient(45deg,var(--stale) 0 2px,var(--stale-soft) 2px 4px);border:1px solid var(--stale)}
.rbar .r{background:var(--money)} .rbar .a{background:var(--warn)} .rbar .u{background:repeating-linear-gradient(45deg,var(--stale) 0 3px,var(--stale-soft) 3px 6px)}
@media (max-width:760px){.rrow{grid-template-columns:1fr}.rcounts{flex-wrap:wrap}}
.case{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.case.crit{border-left:3px solid var(--crit)}
.case.warn{border-left:3px solid var(--warn)}
.case h3{font-size:16px}
.meta{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--ink2)}
.detail{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:10px}
.hrow{padding:12px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.hrow:first-of-type{border-top:0}
.hrow .top2{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
details.fold > summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
details.fold > summary::-webkit-details-marker{display:none}
details.fold > summary::after{content:"Show";font-size:13px;color:var(--accent);font-weight:500}
details.fold[open] > summary::after{content:"Hide"}
.secthead{display:flex;flex-direction:column;gap:2px}
.secthead p{font-size:13px;color:var(--ink2)}
.conclusion{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:16px 18px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
.conclusion .k{font-size:12.5px;color:var(--ink3)}
@media (max-width:760px){.conclusion{grid-template-columns:1fr}}
.str{font-size:12px;color:var(--ink3)}
.kv{display:grid;grid-template-columns:120px minmax(0,1fr);gap:8px 14px;font-size:13.5px;align-items:start}
.kv dt{color:var(--ink3)} .kv dd{margin:0}
.vt{width:100%;min-width:0;font-size:13px}
.vt td,.vt th{padding:8px 10px}
.out-note{font-size:12px;color:var(--ink3)}
.btn.oos{border-style:dashed;color:var(--ink3)}
.footnote{font-size:12px;color:var(--ink3);border-top:1px solid var(--line);padding-top:12px}
@media (max-width:760px){

function figures(list){

  return {n, parts, down, cost, before, after, avoided, net:avoided-cost, breakeven:Math.max(1,Math.ceil(cost/FAIL_COST-1e-9))};

/* Accessible modal: focus moves in, Tab is trapped, Escape closes, focus returns */
function Modal({title, onClose, children}){
  const box = useRef(null);
  useEffect(()=>{
    const prev = document.activeElement;
    const sel = 'button:not([disabled]),input:not([disabled]),select,textarea,[href]';
    const first = box.current.querySelector(sel); first && first.focus();
    const k = e=>{
      if(e.key==="Escape"){ e.stopPropagation(); onClose(); }
      if(e.key==="Tab"){ const f=[...box.current.querySelectorAll(sel)]; if(!f.length) return;
        if(e.shiftKey && document.activeElement===f[0]){ e.preventDefault(); f[f.length-1].focus(); }
        else if(!e.shiftKey && document.activeElement===f[f.length-1]){ e.preventDefault(); f[0].focus(); } }
    };
    document.addEventListener("keydown",k,true);
    return ()=>{ document.removeEventListener("keydown",k,true); prev && prev.focus && prev.focus(); };
  },[]);
  return <div className="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div className="scrim" onClick={onClose}/>
    <div className="box" ref={box} style={{position:"relative",zIndex:26}}><h2 id="modal-title">{title}</h2>{children}</div></div>;
}

function weekItems(S){

/* ============ Track ============ */
const VIEW_T = {d5: 13*24+12};   // Tue 13 Oct, 12:00
function slotOf(S,t){ return (S.rebooked && S.rebooked.id===t.id) ? S.rebooked.slot : t.slot; }
function failIdOf(S){
  if(!S.approved) return null;
  const c = S.approved.list.filter(t=>!["cancelled","cancel_requested","issue"].includes(S.slots[t.id]));
  return ((c.find(t=>t.slot[0]===10))||c[0]||{}).id;
}
function slotStatus(S, t){
  const st = S.slots[t.id] || "pending";
  if(["cancelled","cancel_requested","issue"].includes(st)) return st;
  if(S.view==="now") return st;
  if(S.view==="d90") return "completed";
  const s = slotOf(S,t); const start = s[0]*24+s[1], now = VIEW_T.d5;
  if(S.vendorFailed && t.id===failIdOf(S)) return "vendor_cancelled";
  if(S.rebooked && S.rebooked.id===t.id) return start+4<=now ? "completed" : "rebooked";
  return start+4<=now ? "completed" : start<=now ? "in_service" : "confirmed";
}
function Track({S, A}){
  if(!S.approved) return <div className="page"><h1>Nothing approved yet</h1><p className="muted">Approve the clutch proposal to track it here.</p><div><button className="btn primary" onClick={()=>A.go("proposal")}>Open the proposal</button></div></div>;
  const ap = S.approved;
  const active = ap.list.filter(t=>S.slots[t.id]!=="cancelled");
  const counts = {}; active.forEach(t=>{const s=slotStatus(S,t); counts[s]=(counts[s]||0)+1});
  const lastDay = active.length ? Math.max(...active.map(t=>slotOf(S,t)[0])) : 9;
  const outcomeDate = fmtDate(plusDays(lastDay,90));
  const confirmedN = active.filter(t=>S.slots[t.id]==="confirmed").length;
  const allConfirmed = active.every(t=>(S.slots[t.id]||"pending")!=="pending");
  const chip = S.view==="d90" ? <Chip tone="ok">Completed · outcome checked</Chip> : S.view==="d5" ? <Chip tone="info">In progress</Chip> : <Chip tone={allConfirmed?"info":"warn"}>{allConfirmed?"Scheduled":"Waiting for vendor"}</Chip>;
  const steps = [
    {k:"Approved", s:`Thu 8 Oct, by you · ${inr(ap.pay)}`, c:"done"},
    {k:"Scheduled", s: S.view==="now" ? `${confirmedN} of ${active.length} confirmed by vendor` : `${active.length} slots booked`, c: S.view==="now"&&!allConfirmed?"now":"done"},
    {k:"In service", s: S.view==="now"?"First slot Fri 9 Oct": S.view==="d5" ? `${counts.completed||0} done, ${counts.in_service||0} in service${counts.vendor_cancelled?`, ${counts.vendor_cancelled} cancelled by vendor`:""}${counts.rebooked?`, ${counts.rebooked} rebooked`:""}` : "All done", c: S.view==="now"?"":S.view==="d5"?(counts.vendor_cancelled?"fail":"now"):"done"},
    {k:"Completed", s: S.view==="d90"?`Last service ${DAYS[lastDay]}`:"—", c:S.view==="d90"?"done":""},
    {k:"Outcome checked", s: `${S.view==="d90"?"Checked":"Due"} ${outcomeDate}`, c:S.view==="d90"?"done":""},
  ];
  const label = {pending:["warn","Waiting for vendor"], confirmed:["info","Confirmed"], cancelled:["stale","Cancelled by you · no charge"], cancel_requested:["warn","Cancellation requested · waiting for vendor"], completed:["ok","Completed"], in_service:["warn","In service"], vendor_cancelled:["crit","Cancelled by vendor"], rebooked:["info","Rebooked"], issue:["warn","Issue raised · Rahul following up"]};
  const failT = ap.list.find(t=>t.id===failIdOf(S));
  const actualSpend = active.length*ap.price + 2300;
  const fa = figures(active);
  return <div className="page">
    <div className="spread">
      <div className="col" style={{gap:8}}><div className="row">{chip}<span className="faint sm">Approved by you, Thu 8 Oct · {ap.vendor}{S.partial?` · ${S.partial} truck${S.partial>1?"s":""} still need a slot`:""}</span></div><h1>Clutch service, {active.length} trucks</h1></div>
      <div className="col" style={{gap:6,alignItems:"flex-end"}}><span className="faint xs">See this plan on</span>
        <div className="seg" role="group" aria-label="Point in time">
          <button aria-pressed={S.view==="now"} onClick={()=>A.set({view:"now"})}>Today, 8 Oct</button>
          <button aria-pressed={S.view==="d5"} onClick={()=>A.set({view:"d5"})}>Tue 13 Oct</button>
          <button aria-pressed={S.view==="d90"} onClick={()=>A.set({view:"d90", outcomeSeen:true})}>{outcomeDate}</button>
        </div></div>
    </div>
    <div className="steps">{steps.map(s=><div key={s.k} className={"step "+s.c}><b>{s.k}</b><span>{s.s}</span></div>)}</div>
    <p className="faint xs">Outcome check: each truck is reviewed 90 days after its own service. This batch review runs 90 days after the last service ({DAYS[lastDay]} → {outcomeDate}).</p>

    {S.view==="d5" && S.vendorFailed && failT && S.slots[failT.id]!=="cancelled" && <div className="notice crit"><div className="col" style={{gap:8}}>
      <span><b>{ap.vendor} cancelled the {slotLabel(failT.slot)} slot for {failT.id}</b> (mechanic unavailable). Nothing was charged.</span>
      <div className="row"><button className="btn sm primary" onClick={()=>A.rebook(failT.id,[14,14],"Sai Auto Works, Bhiwandi")}>Rebook Wed 14 Oct, 14:00 (Sai Auto Works)</button>
      <button className="btn sm" onClick={()=>A.modal({type:"rebook", id:failT.id})}>Other options</button></div>
    </div></div>}
    {S.view==="d5" && S.rebooked && <div className="notice ok sm"><span>{S.rebooked.id} rebooked for {slotLabel(S.rebooked.slot)} at {S.rebooked.vendor}. Outcome check moves to {outcomeDate}.</span></div>}

    {S.view==="d90" ? <div className="grid2">
      <div className="panel">
        <h2>What happened</h2>
        <div className="receipt">
          <span>Approved payment</span><span className="r">{inr(active.length*ap.price)}</span>
          <span>Actual spend from invoices (one truck needed a pressure plate)</span><span className="r">{inr(actualSpend)}</span>
          <span>Clutch failures observed in these {active.length} trucks</span><span className="r">0</span>
          <span>Failures in 18 similar trucks not serviced, same period (illustrative)</span><span className="r">3</span>
        </div>
        <h3>Predicted at approval (estimate)</h3>
        <div className="receipt">
          <span className="faint">Failures without → with service</span><span className="r faint">{fa.before.toFixed(1)} → {fa.after.toFixed(1)}</span>
          <span className="faint">Estimated loss avoided</span><span className="r faint">{lakh(fa.avoided)}</span>
        </div>
        <p className="faint xs">Zero failures is consistent with the prediction but doesn't prove the estimated saving. The comparison group is the stronger signal, and it's still small.</p>
      </div>
      <div className="panel">
        <h2>You've approved 5 proposals like this one</h2>
        <p className="muted sm">All were clutch or brake wear on 3 or more trucks of one model, under ₹50,000. You could let SuprFleet prepare or book these within limits you set. Test it on past cases first.</p>
        <div><button className="btn primary" onClick={()=>A.go("rule")}>Try an automation rule</button></div>
      </div>
    </div> :
    <div className="panel flush">
      <div className="ph"><h2>Trucks</h2><span className="faint sm">Owner: Rahul Patil</span></div>
      {ap.list.map(t=>{
        const st = slotStatus(S,t); const [tone,txt] = label[st];
        const slot = slotOf(S,t);
        let action = null;
        if(st==="pending") action = <button className="btn sm" onClick={()=>A.cancelBooking(t.id)}>Cancel booking</button>;
        else if(st==="confirmed"||st==="rebooked") action = <button className="btn sm" onClick={()=>A.modal({type:"reqcancel", id:t.id, slot})}>Request cancellation</button>;
        else if(st==="in_service"||st==="completed") action = <button className="btn sm" onClick={()=>A.modal({type:"issue", id:t.id})}>Raise an issue</button>;
        return <div key={t.id} className="slotrow"><div><div style={{fontWeight:500}}>{t.id}</div><div className="sm muted">{slotLabel(slot)} · {S.rebooked&&S.rebooked.id===t.id?S.rebooked.vendor:ap.vendor}</div></div>
          <div className="acts"><Chip tone={tone}>{txt}</Chip>{action}</div></div>})}
    </div>}
  </div>;
}

function RuleScreen({S, A}){
  const [tested, setTested] = useState(0);
  const [mode, setMode] = useState(null);
  const [limitOk, setLimitOk] = useState(false);

  if(rule.status==="On"||rule.status==="Paused") return <div className="page"><h1>Clutch and brake rule</h1>
    <div className="notice ok"><span>This rule is <b>{rule.status.toLowerCase()}</b>. {rule.mode}. Limit: {rule.limit}.</span></div><div><button className="btn" onClick={()=>A.go("rules")}>See automation rules</button></div></div>;
  const cases = tested===2
    ? [["m","2 Apr"],["m","9 May"],["x","2 Jul"],["m","30 Jul"],["s","18 Aug"],["m","3 Sep"],["m","24 Sep"]]
    : [["m","2 Apr"],["m","9 May"],["r","2 Jul"],["m","30 Jul"],["s","18 Aug"],["m","3 Sep"],["m","24 Sep"]];
  const tone = {m:"ok", r:"warn", s:"stale", x:"line"};
  const label = {m:"Would run · matches your decision", r:"Would run · you rejected it", s:"Skipped · data was stale", x:"Now excluded · trucks marked for sale"};
  return <div className="page">
    <div className="col" style={{gap:8}}><h1>New automation rule</h1><p className="muted">Narrow on purpose. Test it on the last 6 months before it does anything.</p></div>
    <div className="panel">
      <p className="rule">When <span className="tok">3 or more trucks of the same model</span> show <span className="tok">clutch or brake wear</span> with <span className="tok">strong evidence</span>, and the service costs <span className="tok">under ₹50,000</span> in total, <span className="tok">book the preferred vendor in each truck's quietest window</span>{tested===2 && <> and <span className="tok">skip trucks marked for sale</span></>}.</p>
      <p className="sm muted">This rule can never: <span className="tok lock">control a vehicle</span> <span className="tok lock">change routes</span> <span className="tok lock">spend above ₹50,000</span> <span className="tok lock">act on safety cases</span></p>
      <div className="row"><button className="btn primary" onClick={()=>setTested(1)} disabled={tested>0}>{tested>0?"Tested":"Test on the last 6 months"}</button></div>
    </div>
    {tested>0 && <div className="panel">
      <div className="spread"><h2>7 past cases evaluated</h2><span className="faint sm">Apr – Sep 2026</span></div>
      <div className="col" style={{gap:0}}>{cases.map(([k,d],i)=><div key={i} className="item" style={{padding:"9px 0"}}><div className="sm">{d}</div><div className="n"><Chip tone={tone[k]}>{label[k]}</Chip></div></div>)}</div>
      {tested===1 && <div className="notice warn"><div className="col" style={{gap:8}}><span><b>Suggested change, not applied yet.</b> On 2 Jul you rejected it because those trucks were about to be sold. Add "skip trucks marked for sale"?</span><div><button className="btn sm" onClick={()=>setTested(2)}>Add the change and test again</button></div></div></div>}
      {tested===2 && <div className="notice ok sm"><span>Retested with the change: 5 would run and all match your decisions, 1 is now excluded, 1 is skipped because its data was stale (the safe outcome).</span></div>}
      <p className="sm muted">Matching 5 past decisions is a preview, not proof that future bookings will be right. The rule pauses itself if you cancel or reject 2 of its bookings, and you can pause it any time.</p>
      {tested===2 && <>
      <h3 style={{marginTop:6}}>How should it run?</h3>
      <div className="radio">
        <label><input type="radio" name="mode" id="mode-ask" checked={mode==="ask"} onChange={()=>{setMode("ask");setLimitOk(false)}}/><span><b>Ask me first.</b> <span className="muted">It prepares the booking; you approve each one. Nothing is spent without you. (Advisor plan, assumed)</span></span></label>
        <label><input type="radio" name="mode" id="mode-act" checked={mode==="act"} onChange={()=>setMode("act")}/><span><b>Book it and tell me.</b> <span className="muted">Books on its own; you can cancel free until the vendor confirms. (Delegate plan, assumed)</span></span></label>
      </div>
      {mode==="act" && <div className="notice warn sm"><label style={{display:"flex",gap:10,alignItems:"flex-start",cursor:"pointer"}}><input type="checkbox" id="limit-ok" checked={limitOk} onChange={e=>setLimitOk(e.target.checked)}/><span><b>Raise this rule's spending limit from the ₹5,000 default to ₹50,000.</b> Applies to this rule only. It equals your own approval limit, so the rule can't spend more than you could.</span></label></div>}
      <div className="row"><button className="btn primary" disabled={!mode || (mode==="act"&&!limitOk)} onClick={()=>A.enableRule(mode)}>Turn on rule</button>
        <button className="btn ghost" onClick={A.saveRuleDraft}>Save as draft</button></div></>}
    </div>}
  </div>;
}

const PARENT = {proposal:"decisions",evidence:"proposal",review:"proposal",track:"decisions",rule:"rules",theft:"decisions"};

function approvedSnapshot(list, v){ const f=figures(list); return {...f, list, vendor:`${v.name}, ${v.loc}`, price:v.price, pay:list.length*v.price}; }
function ensureApproved(s){
  if(s.approved) return {};
  const d = draft(s); const v = VENDORS[0];
  const list = d.list.filter(t=>v.slots[t.id]).map(t=>({...t, slot:v.slots[t.id]}));
  return {approved:approvedSnapshot(list,v), pstatus:"approved", slots:Object.fromEntries(list.map(t=>[t.id,"pending"])), failId:(list.find(t=>t.slot[0]===10)||list[0]).id, view:"now", availReq:"confirmed"};
}

function outcomeInfo(S){
  if(!S.approved) return null;
  const active = S.approved.list.filter(t=>S.slots[t.id]!=="cancelled");
  const lastDay = active.length ? Math.max(...active.map(t=>slotOf(S,t)[0])) : 9;
  const d = plusDays(lastDay,90);
  return {lastDay, date:d, key:d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate()};
}
const D13 = {d:20261013, time:"12:10"};                       // actions taken while viewing Tue 13 Oct
function ruleWhen(S){ const o = S.outcomeSeen && outcomeInfo(S); return o ? {d:o.key, time:"10:20"} : {d:20261008, time:"08:"+String(Math.min(59,S.clock)).padStart(2,"0")}; }
function dayLabel(d){ const y=Math.floor(d/10000), m=Math.floor(d/100)%100, dd=d%100; const dt=new Date(y,m-1,dd);
  return `${dt.toLocaleDateString("en-GB",{weekday:"short"})} ${dd} ${dt.toLocaleDateString("en-GB",{month:"short"})} ${y}`; }

      <select id="demo-state" value={S.mode} onChange={e=>{const m=e.target.value; setToastMsg(null); setModal(null); setAskOpen(null); setS(()=> m==="failed" ? (()=>{const b={...INITIAL(), mode:m}; return {...b, ...ensureApproved(b), view:"d5", screen:"track"}})() : {...INITIAL(), mode:m, screen:"today"}); window.scrollTo({top:0})}} aria-label="Demo state">
        <option value="normal">Normal day</option><option value="loading">Loading</option><option value="empty">New account</option>
        <option value="stale">Stale data</option><option value="failed">Action failed</option><option value="dense">Dense day (500 assets)</option>
      </select>
    </div>
  </div>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
