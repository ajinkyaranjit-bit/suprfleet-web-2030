<title>SuprFleet 2030 Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap">
<style>
/* Layout: narrow left rail · main working column · optional right Ask panel. Calm porcelain surface, cobalt for actions, serif only for the system's answers. */
:root{
  --paper:#F3F4F1; --surface:#FFFFFF; --sunk:#EEF0EC; --ink:#18212B; --ink2:#4D5966; --ink3:#7A8591; --line:#DDE1DB; --line2:#C9CEC7;
  --accent:#2446C9; --accent-ink:#FFFFFF; --accent-soft:#E8EDFB;
  --money:#11704A; --money-soft:#E3F2EA; --warn:#9A5800; --warn-soft:#FBF0DE; --crit:#B3261E; --crit-soft:#FBE8E6; --stale:#6A6F78; --stale-soft:#ECEDEF;
  --f-ui:"Geist", "Segoe UI", system-ui, sans-serif; --f-say:"Newsreader", Georgia, "Times New Roman", serif;
  --r-s:6px; --r-m:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#12161B; --surface:#1A2027; --sunk:#151A20; --ink:#E9ECEF; --ink2:#AEB6BF; --ink3:#808A95; --line:#2A323B; --line2:#3A434D;
  --accent:#7D97FF; --accent-ink:#0E1424; --accent-soft:#1E2847; --money:#5CC995; --money-soft:#16312A; --warn:#F0B35A; --warn-soft:#352813;
  --crit:#FF8A80; --crit-soft:#3A1A18; --stale:#A2A8B1; --stale-soft:#252B32; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#12161B; --surface:#1A2027; --sunk:#151A20; --ink:#E9ECEF; --ink2:#AEB6BF; --ink3:#808A95; --line:#2A323B; --line2:#3A434D;
  --accent:#7D97FF; --accent-ink:#0E1424; --accent-soft:#1E2847; --money:#5CC995; --money-soft:#16312A; --warn:#F0B35A; --warn-soft:#352813;
  --crit:#FF8A80; --crit-soft:#3A1A18; --stale:#A2A8B1; --stale-soft:#252B32; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font:14px/1.5 var(--f-ui);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:208px minmax(0,1fr);min-height:100%}
.rail{border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;background:var(--paper)}
.brand{font-weight:600;font-size:15px;padding:4px 10px 16px;display:flex;align-items:center;gap:8px}
.brand i{width:18px;height:18px;border-radius:5px;background:var(--ink);display:inline-block;position:relative}
.brand i::after{content:"";position:absolute;inset:5px;border-radius:2px;background:var(--paper)}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px;white-space:nowrap;padding:8px 10px;border-radius:var(--r-s);border:0;background:none;text-align:left;cursor:pointer;color:var(--ink2)}
.nav:hover{background:var(--sunk);color:var(--ink)}
.nav[aria-current="page"]{background:var(--surface);color:var(--ink);font-weight:500;box-shadow:0 0 0 1px var(--line)}
.count{font-size:12px;min-width:20px;text-align:center;padding:0 6px;border-radius:999px;background:var(--warn-soft);color:var(--warn);font-weight:600}
.rail .who{margin-top:auto;padding:10px;font-size:12.5px;color:var(--ink3);border-top:1px solid var(--line)}
.rail .who b{display:block;color:var(--ink);font-weight:500}
.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding:14px 28px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--paper);z-index:5}
.crumbs{display:flex;gap:6px;align-items:center;color:var(--ink3);font-size:13px;min-width:0;flex-wrap:wrap}
.crumbs button{border:0;background:none;padding:0;color:var(--ink2);cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line2)}
.fresh{margin-left:auto;font-size:12.5px;color:var(--ink3);white-space:nowrap}
.fresh.bad{color:var(--warn)}
.askbtn{display:flex;align-items:center;gap:10px;border:1px solid var(--line2);background:var(--surface);border-radius:999px;padding:6px 8px 6px 14px;cursor:pointer;color:var(--ink2);min-width:220px}
.askbtn kbd{font:12px var(--f-ui);border:1px solid var(--line);border-radius:5px;padding:0 6px;color:var(--ink3);margin-left:auto}
.page{padding:26px 28px 120px;max-width:1120px;width:100%;display:flex;flex-direction:column;gap:22px}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
h1{font-size:22px} h2{font-size:17px} h3{font-size:15px}
p{margin:0}
.say{font-family:var(--f-say);font-weight:400;font-size:clamp(24px,2.6vw,32px);line-height:1.2;letter-spacing:-.01em;max-width:30ch;text-wrap:balance}
.say.s{font-size:22px;max-width:40ch}
.muted{color:var(--ink2)} .faint{color:var(--ink3)} .sm{font-size:13px} .xs{font-size:12px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.spread{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
.grid2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px}
@media (max-width:980px){.grid2{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel.flush{padding:0;gap:0}
.panel .ph{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:16px 18px 10px}
.btn{border:1px solid var(--line2);background:var(--surface);border-radius:var(--r-s);padding:8px 14px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--ink3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:none;color:var(--ink2);padding-inline:8px}
.btn.ghost:hover{color:var(--ink);background:var(--sunk)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.link{border:0;background:none;padding:0;color:var(--accent);cursor:pointer;font-weight:500}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;border-radius:999px;padding:2px 9px;white-space:nowrap}
.chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.crit{background:var(--crit-soft);color:var(--crit)} .chip.ok{background:var(--money-soft);color:var(--money)}
.chip.stale{background:var(--stale-soft);color:var(--stale)} .chip.info{background:var(--accent-soft);color:var(--accent)} .chip.line{border:1px solid var(--line2);color:var(--ink2)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}

/* Safety strip */
.urgent{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--crit-soft);border:1px solid color-mix(in srgb,var(--crit) 35%,transparent);border-radius:var(--r-m);padding:12px 16px}
.urgent .ic{width:28px;height:28px;border-radius:50%;background:var(--crit);color:#fff;display:grid;place-items:center;font-weight:700}
@media (max-width:700px){.urgent{grid-template-columns:1fr}}

/* Vitals */
.vitals{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r-m);background:var(--surface)}
.vital{padding:14px 16px;display:flex;flex-direction:column;gap:2px;border-right:1px solid var(--line);min-width:0;text-align:left;background:none;border-top:0;border-bottom:0;border-left:0}
.vital:last-child{border-right:0}
.vital .k{font-size:12.5px;color:var(--ink3)}
.vital .v{font-size:22px;font-weight:600;letter-spacing:-.01em}
.vital .d{font-size:12px;color:var(--ink2)}
.vital.button{cursor:pointer} .vital.button:hover{background:var(--sunk)}
.vital .v small{font-size:14px;color:var(--ink3);font-weight:500}
@media (max-width:900px){.vitals{grid-template-columns:repeat(2,minmax(0,1fr))}.vital{border-bottom:1px solid var(--line)}}

/* Lists */
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;padding:14px 18px;border-top:1px solid var(--line);align-items:center;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.item.button{cursor:pointer} .item.button:hover{background:var(--sunk)}
.item .t{font-weight:500}
.item .m{font-size:13px;color:var(--ink2)}
.item .n{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.item .n b{font-weight:600}
.est{border-bottom:1px dashed currentColor}
.mix{display:flex;height:8px;border-radius:4px;overflow:hidden;gap:2px}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--ink2)}
.legend span{display:inline-flex;gap:6px;align-items:center}

/* Tables */
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{text-align:left;padding:10px 14px;border-top:1px solid var(--line);vertical-align:middle;font-size:13.5px}
th{font-weight:500;color:var(--ink3);font-size:12.5px;border-top:0;padding-top:4px}
tr.out td{color:var(--ink3);text-decoration:line-through;text-decoration-color:var(--line2)}
tr.out td:last-child{text-decoration:none}

/* Money receipt */
.receipt{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 20px;font-size:13.5px}
.receipt .r{text-align:right}
.receipt .tot{font-weight:600;border-top:1px solid var(--line);padding-top:6px}
.figures{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border:1px solid var(--line);border-radius:var(--r-m)}
.fig{padding:12px 14px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px;min-width:0}
.fig:last-child{border-right:0}
.fig .k{font-size:12.5px;color:var(--ink3)}
.fig .v{font-size:20px;font-weight:600}
.fig.pos .v{color:var(--money)}
@media (max-width:800px){.figures{grid-template-columns:repeat(2,minmax(0,1fr))}.fig{border-bottom:1px solid var(--line)}}

/* Evidence ledger: the signature element */
.ledger{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border:1px solid var(--line);border-radius:var(--r-m);background:var(--surface)}
.lcol{padding:16px 18px;display:flex;flex-direction:column;gap:12px;border-right:1px solid var(--line);min-width:0}
.lcol:last-child{border-right:0}
.lcol h3{display:flex;gap:8px;align-items:center}
.ev{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;font-size:13.5px}
.ev .mk{width:18px;height:18px;border-radius:4px;display:grid;place-items:center;font-size:11px;font-weight:700;margin-top:1px}
.mk.sup{background:var(--money-soft);color:var(--money)} .mk.mis{background:var(--stale-soft);color:var(--stale);border:1px dashed var(--stale)} .mk.alt{background:var(--warn-soft);color:var(--warn)}
.ev .src{font-size:12px;color:var(--ink3)}
.weight{display:inline-flex;gap:2px;vertical-align:middle;margin-left:4px}
.weight i{width:6px;height:10px;border-radius:1px;background:var(--line2)}
.weight i.on{background:var(--ink2)}
@media (max-width:900px){.ledger{grid-template-columns:1fr}.lcol{border-right:0;border-bottom:1px solid var(--line)}}

.notice{display:flex;gap:12px;align-items:flex-start;border-radius:var(--r-m);padding:12px 14px;font-size:13.5px}
.notice.info{background:var(--accent-soft)} .notice.ok{background:var(--money-soft)} .notice.warn{background:var(--warn-soft)} .notice.crit{background:var(--crit-soft)} .notice.stale{background:var(--stale-soft)}
.notice b{font-weight:600}

/* Stepper */
.steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0}
.step{display:flex;flex-direction:column;gap:6px;padding-top:12px;border-top:3px solid var(--line);font-size:13px;color:var(--ink3);padding-right:10px}
.step.done{border-color:var(--money);color:var(--ink)}
.step.now{border-color:var(--accent);color:var(--ink)}
.step.fail{border-color:var(--crit);color:var(--ink)}
.step b{font-weight:600;font-size:13.5px}
@media (max-width:760px){.steps{grid-template-columns:1fr 1fr}}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:var(--r-s);overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 12px;cursor:pointer;font-size:13px;color:var(--ink2);border-right:1px solid var(--line2)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}

/* Rule builder */
.rule{font-size:16px;line-height:2.1;max-width:62ch}
.tok{display:inline-block;border:1px solid var(--line2);background:var(--sunk);border-radius:6px;padding:0 8px;line-height:1.7;font-weight:500}
.tok.lock{border-style:dashed;color:var(--ink3);background:none}
.hist{display:grid;grid-template-columns:repeat(26,1fr);gap:3px;align-items:end;height:56px}
.hist i{display:block;border-radius:2px;background:var(--line)}
.hist i.m{background:var(--money)} .hist i.r{background:var(--warn)} .hist i.x{background:var(--stale);opacity:.6}

/* Skeleton */
.sk{background:linear-gradient(90deg,var(--sunk),var(--line),var(--sunk));background-size:200% 100%;animation:sh 1.4s linear infinite;border-radius:6px}
@keyframes sh{to{background-position:-200% 0}}
@media (prefers-reduced-motion: reduce){.sk{animation:none}}

/* Ask panel */
.scrim{position:fixed;inset:0;background:rgba(10,14,20,.28);z-index:20}
.ask{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--surface);border-left:1px solid var(--line);z-index:21;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.ask header{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)}
.ask .body{padding:18px;display:flex;flex-direction:column;gap:14px;overflow:auto;flex:1}
.ask input{width:100%;border:1px solid var(--line2);border-radius:var(--r-s);padding:10px 12px;background:var(--paper);color:var(--ink);font:inherit}
.sugg{display:flex;flex-direction:column;gap:6px}
.sugg button{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-s);padding:9px 12px;cursor:pointer}
.sugg button:hover{border-color:var(--ink3)}
.answer{border:1px solid var(--line);border-radius:var(--r-m);padding:14px;display:flex;flex-direction:column;gap:10px}
.bars{display:flex;flex-direction:column;gap:6px}
.bars div{display:grid;grid-template-columns:120px minmax(0,1fr) 56px;gap:8px;align-items:center;font-size:12.5px}
.bars span.b{height:8px;border-radius:4px;background:var(--accent)}

/* Prototype controls (not product UI) */
.demo{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:15;background:var(--ink);color:var(--paper);border-radius:12px;padding:8px;display:flex;gap:6px;align-items:center;flex-wrap:nowrap;overflow-x:auto;white-space:nowrap;max-width:calc(100% - 24px);box-shadow:0 8px 30px rgba(0,0,0,.18)}
.demo .lbl{font-size:12px;opacity:.7;padding:0 6px}
.demo button{border:0;background:transparent;color:inherit;border-radius:7px;padding:6px 9px;cursor:pointer;font-size:12.5px;opacity:.82}
.demo button:hover{opacity:1;background:rgba(255,255,255,.08)}
.demo button[aria-pressed="true"]{background:var(--paper);color:var(--ink);opacity:1}
.demo select{background:transparent;color:inherit;border:1px solid rgba(255,255,255,.25);border-radius:7px;padding:5px 6px;font:12.5px var(--f-ui)}
.demo select option{color:#111}
.demo .sep{width:1px;height:20px;background:rgba(255,255,255,.2)}

.toast{position:fixed;top:72px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:8px;z-index:30;font-size:13.5px}
.modal{position:fixed;inset:0;display:grid;place-items:center;z-index:25;padding:16px}
.modal .box{background:var(--surface);border-radius:12px;border:1px solid var(--line);max-width:520px;width:100%;padding:20px;display:flex;flex-direction:column;gap:14px}
.radio{display:flex;flex-direction:column;gap:6px}
.radio label{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:var(--r-s);padding:10px 12px;cursor:pointer}
.radio input{margin-top:3px}
textarea{width:100%;min-height:64px;border:1px solid var(--line2);border-radius:var(--r-s);padding:8px 10px;background:var(--paper);color:var(--ink);font:inherit}

@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .rail{position:static;height:auto;flex-direction:row;overflow-x:auto;padding:10px 12px;border-right:0;border-bottom:1px solid var(--line)}
  .brand{padding:4px 8px}
  .rail .who{display:none}
  .top{padding:12px 16px;flex-wrap:wrap}
  .askbtn{min-width:0;flex:1 1 100%;white-space:nowrap}
  .askbtn kbd{display:none}
  .crumbs{flex:1 1 100%}
  .fresh{margin-left:0;white-space:normal}
  .page{padding:20px 16px 160px}
}
</style>

<style>
/* v2 additions: morning readiness, cases, handover, honest states */
.grid2{align-items:start}
.head{display:flex;flex-direction:column;gap:10px}
.head .when{font-size:13px;color:var(--ink2)}
.head .sub{color:var(--ink2);max-width:68ch}
.ready{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:18px;display:flex;flex-direction:column;gap:16px}
.rrow{display:grid;grid-template-columns:170px minmax(0,1fr) auto;gap:16px;align-items:center}
.rrow .lbl b{display:block;font-weight:600}
.rrow .lbl span{font-size:12.5px;color:var(--ink3)}
.rbar{display:flex;height:12px;gap:2px;border-radius:4px;overflow:hidden;background:var(--surface)}
.rbar span{display:block;height:100%}
.rcounts{display:flex;gap:16px;font-size:13px;white-space:nowrap}
.rcounts span{display:inline-flex;gap:6px;align-items:center}
.rcounts b{font-weight:600}
.sw{width:10px;height:10px;border-radius:2px;display:inline-block}
.sw.r{background:var(--money)} .sw.a{background:var(--warn)} .sw.u{background:repeating-linear-gradient(45deg,var(--stale) 0 2px,var(--stale-soft) 2px 4px);border:1px solid var(--stale)}
.rbar .r{background:var(--money)} .rbar .a{background:var(--warn)} .rbar .u{background:repeating-linear-gradient(45deg,var(--stale) 0 3px,var(--stale-soft) 3px 6px)}
@media (max-width:760px){.rrow{grid-template-columns:1fr}.rcounts{flex-wrap:wrap}}
.case{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.case.crit{border-left:3px solid var(--crit)}
.case.warn{border-left:3px solid var(--warn)}
.case h3{font-size:16px}
.meta{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--ink2)}
.detail{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:10px}
.hrow{padding:12px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.hrow:first-of-type{border-top:0}
.hrow .top2{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
details.fold > summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
details.fold > summary::-webkit-details-marker{display:none}
details.fold > summary::after{content:"Show";font-size:13px;color:var(--accent);font-weight:500}
details.fold[open] > summary::after{content:"Hide"}
.secthead{display:flex;flex-direction:column;gap:2px}
.secthead p{font-size:13px;color:var(--ink2)}
.conclusion{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:16px 18px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
.conclusion .k{font-size:12.5px;color:var(--ink3)}
@media (max-width:760px){.conclusion{grid-template-columns:1fr}}
.str{font-size:12px;color:var(--ink3)}
.kv{display:grid;grid-template-columns:120px minmax(0,1fr);gap:8px 14px;font-size:13.5px;align-items:start}
.kv dt{color:var(--ink3)} .kv dd{margin:0}
.vt{width:100%;min-width:0;font-size:13px}
.vt td,.vt th{padding:8px 10px}
.out-note{font-size:12px;color:var(--ink3)}
.btn.oos{border-style:dashed;color:var(--ink3)}
.footnote{font-size:12px;color:var(--ink3);border-top:1px solid var(--line);padding-top:12px}
@media (max-width:760px){
  .item{grid-template-columns:1fr}
  .item .n{align-items:flex-start;text-align:left;flex-direction:row;gap:10px;flex-wrap:wrap}
}

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.25.6/babel.min.js"></script>
<script type="text/babel" data-presets="react">
const {useState, useEffect, useMemo} = React;

/* ============ Scenario (all figures illustrative) ============
   Konkan Infra Services delivers construction materials with its trucks and keeps
   power running at 38 construction sites with generators, inverters and solar charging. */
const COMPANY = "Konkan Infra Services";
const FAIL_COST = 54000;   // ₹38,000 repair + tow, plus 2 days off the road × ₹8,000
const P_BEFORE = 0.45;     // chance of clutch failure in 90 days without service (model, illustrative)
const P_AFTER = 0.08;      // remaining chance after service (assumption: service doesn't remove all risk)
const PARTS = 5000, DOWNTIME = 1000;
const TRUCKS = [
  {id:"MH12-RT-4471", route:"Chakan → Nashik",   sig:"Strong",   seen:"08:31", slot:"Fri 9 Oct, 14:00",  multi:true,  ghat:true,  load:true,  over:true,  depot:"Chakan"},
  {id:"MH04-KL-2210", route:"Bhiwandi → Kasara", sig:"Moderate", seen:"26 h ago", old:true, slot:"Sat 10 Oct, 09:00", multi:true, ghat:true, load:false, over:true, depot:"Bhiwandi"},
  {id:"MH43-BG-9012", route:"Bhiwandi → Nashik", sig:"Strong",   seen:"08:36", slot:"Fri 9 Oct, 16:00",  multi:true,  ghat:true,  load:true,  over:false, depot:"Bhiwandi"},
  {id:"MH12-TQ-1187", route:"Chakan → Bhiwandi", sig:"Strong",   seen:"08:38", slot:"Sat 10 Oct, 11:00", multi:false, ghat:false, load:true,  over:false, depot:"Chakan"},
  {id:"MH15-HX-3301", route:"Nashik → Bhiwandi", sig:"Moderate", seen:"08:12", slot:"Sun 11 Oct, 09:00", multi:true,  ghat:true,  load:true,  over:true,  depot:"Nashik"},
  {id:"MH04-JP-7754", route:"Bhiwandi → Kasara", sig:"Strong",   seen:"08:40", slot:"Sun 11 Oct, 11:00", multi:true,  ghat:true,  load:false, over:true,  depot:"Bhiwandi"},
  {id:"MH12-SV-6620", route:"Chakan → Nashik",   sig:"Moderate", seen:"08:29", slot:"Mon 12 Oct, 09:00", multi:true,  ghat:false, load:true,  over:false, depot:"Chakan"},
  {id:"MH43-CE-0458", route:"Bhiwandi → Kasara", sig:"Strong",   seen:"08:35", slot:"Mon 12 Oct, 11:00", multi:false, ghat:true,  load:true,  over:true,  depot:"Bhiwandi"},
  {id:"MH15-NA-2246", route:"Nashik → Chakan",   sig:"Strong",   seen:"08:22", slot:"Tue 13 Oct, 09:00", multi:true,  ghat:false, load:false, over:true,  depot:"Nashik"},
  {id:"MH04-WD-8890", route:"Bhiwandi → Kasara", sig:"Moderate", seen:"07:58", slot:"Tue 13 Oct, 11:00", multi:true,  ghat:true,  load:true,  over:false, depot:"Bhiwandi"},
];
const MIX = [{k:"Trucks", n:260, c:"#2446C9"},{k:"Generators", n:120, c:"#11704A"},{k:"Inverters & batteries", n:80, c:"#9A5800"},{k:"Solar charging stations", n:40, c:"#7A5AB8"}];
const VENDORS = [
  {n:"Sai Auto Works, Bhiwandi", price:5000, slots:"All 10 slots", rating:"4.6 · 41 jobs with you"},
  {n:"Om Motors, Chakan", price:5400, slots:"8 of 10 slots", rating:"4.4 · 12 jobs"},
  {n:"Shree Garage, Nashik", price:4700, slots:"6 of 10 slots", rating:"4.1 · 5 jobs"},
];
const inr = n => "₹" + Math.round(n).toLocaleString("en-IN");
const lakh = n => "₹" + (n/100000).toFixed(2).replace(/0$/,"").replace(/\.$/,"") + " L";

function plan(excluded, state){
  const list = TRUCKS.filter(t=>!excluded.has(t.id));
  const n = list.length;
  const parts = n*PARTS, down = n*DOWNTIME, cost = parts+down;
  const before = n*P_BEFORE, after = n*P_AFTER;
  const avoided = (before-after)*FAIL_COST;
  const staleIds = state==="stale" ? list.filter(t=>t.depot==="Bhiwandi").map(t=>t.id) : list.filter(t=>t.old).map(t=>t.id);
  return {list, n, parts, down, cost, before, after, avoided, net: avoided-cost,
    breakeven: Math.max(1, Math.ceil(cost/FAIL_COST - 1e-9)),
    multi: list.filter(t=>t.multi).length, ghat: list.filter(t=>t.ghat).length,
    noLoad: list.filter(t=>!t.load).length, over: list.filter(t=>t.over).length, staleIds};
}

/* Readiness: today's commitments across the business */
function readiness(state){
  if(state==="dense") return {rows:[{k:"Material deliveries", s:"truck departures", r:74, a:38, u:8},{k:"Site power", s:"construction sites", r:30, a:6, u:2}]};
  if(state==="stale") return {rows:[{k:"Material deliveries", s:"truck departures", r:92, a:8, u:20},{k:"Site power", s:"construction sites", r:33, a:3, u:2}]};
  return {rows:[{k:"Material deliveries", s:"truck departures", r:106, a:8, u:6},{k:"Site power", s:"construction sites", r:33, a:3, u:2}]};
}

/* ============ Small parts ============ */
const Chip = ({tone="line", children}) => <span className={"chip "+tone}>{children}</span>;
const OOS = ({children, toast, sm}) => <button className={"btn oos"+(sm?" sm":"")} title="Not built in this prototype" onClick={()=>toast("Not built in this prototype.")}>{children}</button>;

function ReadyBar({row}){
  const t=row.r+row.a+row.u;
  return <div className="rrow">
    <div className="lbl"><b>{row.k}</b><span>{t} {row.s} today</span></div>
    <div className="rbar" role="img" aria-label={`${row.r} ready, ${row.a} at risk, ${row.u} unverified`}><span className="r" style={{flex:row.r}}/><span className="a" style={{flex:row.a}}/><span className="u" style={{flex:row.u}}/></div>
    <div className="rcounts"><span><i className="sw r"/><b>{row.r}</b> ready</span><span><i className="sw a"/><b>{row.a}</b> at risk</span><span><i className="sw u"/><b>{row.u}</b> unverified</span></div>
  </div>;
}

/* ============ Today ============ */
function Today({state, go, ctx}){
  const {excluded, m, setM, toast, log, narrow} = ctx;
  if(state==="loading") return <div className="page" aria-busy="true">
    <div className="sk" style={{height:22,maxWidth:260}}/><div className="sk" style={{height:74,maxWidth:640}}/><div className="sk" style={{height:120}}/>
    <div className="grid2"><div className="sk" style={{height:320}}/><div className="sk" style={{height:260}}/></div>
    <p className="faint sm">Reading the latest data from 500 assets…</p></div>;
  if(state==="empty") return <div className="page">
    <div className="head"><span className="when">Welcome, Vikram</span>
    <p className="say s">Your 500 assets are connected. Your first morning review will be ready in about 20 minutes, once we've seen a full cycle of data.</p></div>
    <div className="panel">
      <h2>Getting ready</h2>
      <div className="col sm">
        <div className="row"><Chip tone="ok">Done</Chip> 500 of 500 devices connected</div>
        <div className="row"><Chip tone="info">In progress</Chip> Data received from 312 of 500 assets</div>
        <div className="row"><Chip tone="line">To do</Chip> Connect today's dispatch plan and site schedule, so we can tell you what's ready</div>
        <div className="row"><Chip tone="line">To do</Chip> Set your approval limit and who gets urgent issues at night</div>
      </div>
      <div className="row"><button className="btn primary" onClick={()=>go("rules")}>Set approval limit</button><OOS toast={toast}>Connect dispatch plan</OOS></div>
    </div>
    <div className="notice stale"><span>Nothing needs your decision yet. While we learn your fleet, nothing runs on its own.</span></div>
  </div>;

  const dense = state==="dense", stale = state==="stale";
  const R = readiness(state);
  const tot = R.rows.reduce((a,r)=>({r:a.r+r.r,a:a.a+r.a,u:a.u+r.u}),{r:0,a:0,u:0});
  const all = tot.r+tot.a+tot.u;
  const p = plan(excluded, state);

  const handover = <div className="panel">
    <details className="fold" open={!narrow}>
      <summary><div className="secthead"><h2>Overnight handover</h2><p>Since 18:00 yesterday · what happened, who owns it</p></div></summary>
      <div style={{marginTop:6}}>
        <div className="hrow"><div className="top2"><b>Panel cleaning booked for SOL-07</b><Chip tone={m.cleaningCancelled?"stale":"warn"}>{m.cleaningCancelled?"Cancelled":"Awaiting vendor"}</Chip></div>
          <span className="sm muted">By your rule: cleaning under ₹5,000. ₹1,800.</span>
          {m.cleaningCancelled ? <span className="sm">Cancelled at 08:44, before the vendor confirmed. No charge.</span>
            : <><span className="sm muted">Vendor confirms by 10:00. Work hasn't started, so you can still cancel.</span><div><button className="link sm" onClick={()=>{setM({...m,cleaningCancelled:true}); log("You","Cancelled panel cleaning for SOL-07 before vendor confirmation","No charge")}}>Cancel booking</button></div></>}
        </div>
        <div className="hrow"><div className="top2"><b>Temperature ticket, INV-022</b><Chip tone="info">Open</Chip></div><span className="sm muted">Rahul Patil owns it. Not resolved yet.</span></div>
        <div className="hrow"><div className="top2"><b>Idling notices to 4 operators</b><Chip tone="line">Sent</Chip></div><span className="sm muted">Bhiwandi depot. We'll check tonight whether idling dropped.</span></div>
        <div className="hrow"><div className="top2"><b>3 permit reminders moved to next week</b><Chip tone="ok">Done</Chip></div><span className="sm muted">Permit offices closed for the holiday.</span></div>
      </div>
    </details>
  </div>;

  return <div className="page">
    {stale && <div className="notice warn" role="status"><span><b>Data is 3 hours old for 140 assets at Bhiwandi</b> (network outage since 05:40). Their commitments are counted as unverified, not ready. Proposals that depend on them are paused.</span></div>}
    {state==="failed" && <div className="notice crit"><b>1 action didn't go through.</b><span>Sai Auto Works cancelled a service slot. <button className="link" onClick={()=>go("track")}>Pick a new slot</button></span></div>}

    <div className="head">
      <span className="when">Thursday 8 October · 08:40 · {COMPANY}</span>
      {dense
        ? <p className="say">Flooding at Bhiwandi puts {tot.a} of today's {all} commitments at risk. One reroute decision covers 23 of them.</p>
        : <p className="say">{tot.r} of today's {all} commitments are ready. {tot.a+tot.u} need attention before 10:00.</p>}
      <p className="sub">{dense ? "Rerouting via Thane keeps cement and steel deliveries to 9 sites on time. The rest can wait for the water to clear."
        : `${R.rows[0].a} deliveries are short of a truck or driver, ${R.rows[1].a} sites are low on generator fuel, and ${tot.u} commitments can't be verified${stale?" because of the outage":""}.`}</p>
    </div>

    <section className="ready" aria-label="Today's readiness">
      <div className="spread"><h2>Can today run as planned?</h2><span className="faint sm">Ready means the asset, its operator and the schedule are confirmed. Online alone isn't ready.</span></div>
      {R.rows.map(r=><ReadyBar key={r.k} row={r}/>)}
    </section>

    <div className="grid2">
      <div className="col" style={{gap:14}}>
        <div className="secthead"><h2>Needs you this morning</h2><p>Safety first, then by deadline.</p></div>

        <article className="case crit">
          <div className="meta"><Chip tone="crit">{m.escalated?"Waiting for acknowledgement":"Not acknowledged for 6 h 28 min"}</Chip><span>Overnight · 02:10 · Chakan</span></div>
          <h3>Unexplained fuel loss on MH12-AB-1234</h3>
          <p className="muted sm">40 L lost while the truck was parked. Theft is suspected, not confirmed. Sunita Rao (Safety lead) was alerted at 02:12 and hasn't responded. Your rule escalates to the duty manager at 08:45.</p>
          {m.escalated && <div className="notice info sm"><span>Escalated to Arjun Nair (duty manager) at 08:41. The case stays open until someone acknowledges it.</span></div>}
          <div className="row"><button className="btn" onClick={()=>go("theft")}>Review evidence</button>
            {!m.escalated && <button className="btn" onClick={()=>{setM({...m,escalated:true}); log("You","Escalated fuel-loss case to Arjun Nair (duty manager)","Safety lead hadn't acknowledged in 6 h")}}>Escalate now</button>}</div>
        </article>

        {dense ? <article className="case warn">
          <div className="meta"><Chip tone="warn">Decide by 11:00</Chip><span>62 issues grouped into 7 causes</span></div>
          <h3>Reroute 23 deliveries via Thane</h3>
          <p className="muted sm">72 trucks are stopped by flooding. 23 carry material that 9 sites need today. Rerouting adds ₹18,000 fuel and about 1.5 h.</p>
          <div className="row"><button className="btn primary" onClick={()=>go("decisions")}>See all 7 decisions</button></div>
        </article> : <>
        <article className="case warn">
          <div className="meta"><Chip tone="warn">Before 09:30</Chip><span>{R.rows[0].a} deliveries · dispatch</span></div>
          <h3>{R.rows[0].a} deliveries are short of a truck or driver</h3>
          <p className="muted sm">5 trucks failed their morning check and 3 drivers called in sick. 4 standby trucks are free at Bhiwandi.</p>
          <div className="row"><button className="btn" aria-expanded={!!m.dispatchOpen} onClick={()=>setM({...m,dispatchOpen:!m.dispatchOpen})}>{m.dispatchOpen?"Hide breakdown":"See breakdown"}</button></div>
          {m.dispatchOpen && <div className="detail">
            <div className="receipt"><span>Truck failed morning check</span><span className="r">5</span><span>Driver unavailable</span><span className="r">3</span><span>Standby trucks free now</span><span className="r">4</span></div>
            {m.dispatchAssigned
              ? <div className="notice info sm"><span>Assigned to Priya Shah (dispatch lead) at 08:42. These 8 stay "at risk" until she confirms each one.</span></div>
              : <div className="row"><button className="btn primary" onClick={()=>{setM({...m,dispatchAssigned:true}); log("You","Assigned 8 at-risk deliveries to Priya Shah","Confirm replacements before 09:30")}}>Assign to Priya Shah, dispatch</button></div>}
          </div>}
        </article>

        <article className="case warn">
          <div className="meta"><Chip tone="warn">Before 10:00</Chip><span>{R.rows[1].a} sites · site power</span></div>
          <h3>{R.rows[1].a} sites have less than 6 hours of generator fuel</h3>
          <p className="muted sm">Sites 12, 19 and 27. Grid supply is down at Nashik. One tanker can cover all three: 820 L, ₹18,400.</p>
          {m.fuelApproved
            ? <div className="notice ok sm"><span>Approved ₹18,400 at 08:43. Tanker requested from Bharat Fuels; arrival not confirmed yet.</span></div>
            : <div className="row"><button className="btn primary" onClick={()=>{setM({...m,fuelApproved:true}); log("You","Approved ₹18,400 tanker refuel for sites 12, 19, 27","Fuel under 6 hours")}}>Approve ₹18,400 refuel</button><button className="btn ghost" onClick={()=>go("ask")}>Ask why</button></div>}
        </article>

        <article className="case">
          <div className="meta"><Chip tone="stale">Can't verify</Chip><span>{tot.u} commitments</span></div>
          <h3>{tot.u} commitments have no fresh data</h3>
          <p className="muted sm">{stale ? "Bhiwandi network outage since 05:40. Last known status kept, but it can't confirm today." : "6 trucks in the Kasara ghat low-network corridor and 2 sites whose generators went offline in a power cut at 04:00."} Missing data doesn't mean an asset has stopped.</p>
          <div className="row"><button className="link sm" onClick={()=>go("assets")}>See which ones</button></div>
        </article></>}
      </div>

      <div className="col" style={{gap:14}}>
        {handover}
        <div className="panel flush">
          <div className="ph"><div className="secthead"><h2>Planned improvements</h2><p>This week. Not blocking today.</p></div></div>
          {improvements(p, ctx).map((d,i)=>
            <button key={i} className="item button" onClick={()=>go(d.to||"decisions")}>
              <div><div className="t">{d.t}</div><div className="m">{d.m}</div></div>
              <div className="n"><b className="est">{d.v}</b><span className="faint xs">{d.when}</span></div>
            </button>)}
        </div>
      </div>
    </div>
    <p className="footnote">All figures are illustrative. Readiness assumes the dispatch plan and site schedules are connected.</p>
  </div>;
}
function improvements(p, ctx){
  const st = ctx.pstatus;
  return [
    {t:`Service ${p.n} trucks for early clutch wear`, m: st==="snoozed"?"Snoozed until Mon 12 Oct": st==="dismissed"?"Dismissed by you":st==="approved"?"Approved · in progress":"Decide by Fri 9 Oct to use the quiet slots", v:`Est. ${lakh(p.net)} net`, when:`Cost ${inr(p.cost)}`, to: st==="approved"?"track":"proposal"},
    {t:"Generator DG-118, Hinjewadi: fuel use up 18%", m:"Likely injector wear. Inspection ₹3,500", v:"Est. ₹22,000/mo", when:"Above rule limit", to:"decisions"},
    {t:"6 solar stations producing 14% below forecast", m:"Dust after the dry spell. Cleaning ₹12,000", v:"Est. ₹40,000/mo", when:"Vendor free Sat", to:"decisions"},
  ];
}

/* ============ Proposal ============ */
function Proposal({state, go, ctx}){
  const {excluded, setExcluded, openAsk, pstatus, log} = ctx;
  const p = plan(excluded, state);
  const [showWork, setShowWork] = useState(false);
  const paused = p.staleIds.length>0 && state==="stale";
  return <div className="page">
    <div className="spread">
      <div className="col" style={{gap:8}}>
        <div className="row">{pstatus==="snoozed"?<Chip tone="line">Snoozed until Mon 12 Oct</Chip>:pstatus==="dismissed"?<Chip tone="line">Dismissed</Chip>:<Chip tone="warn">Needs your decision</Chip>}<span className="faint sm">Decide by Fri 9 Oct, 18:00 to use this week's quiet slots</span></div>
        <h1>Service {p.n} trucks for early clutch wear</h1>
        <p className="muted" style={{maxWidth:"70ch"}}>These Tata Signa 4825 trucks show the clutch pattern seen in the 4 that broke down last quarter. A planned service on quiet days costs less than failures on the road.</p>
      </div>
      <button className="btn ghost" onClick={openAsk}>Ask about this</button>
    </div>

    {paused && <div className="notice warn"><span><b>Approval paused.</b> {p.staleIds.length} trucks in this plan have data more than 3 hours old ({p.staleIds.join(", ")}). Exclude them or wait for fresh data.</span></div>}

    <div className="figures">
      <div className="fig"><span className="k">Cost to act</span><span className="v">{inr(p.cost)}</span><span className="faint xs">{inr(p.parts)} service + {inr(p.down)} planned downtime</span></div>
      <div className="fig"><span className="k">Expected failures in 90 days</span><span className="v">{p.before.toFixed(1)} → {p.after.toFixed(1)}</span><span className="faint xs">without service → with service</span></div>
      <div className="fig pos"><span className="k">Estimated loss avoided</span><span className="v est">{lakh(p.avoided)}</span><span className="faint xs">estimate, not a saving yet</span></div>
      <div className="fig pos"><span className="k">Estimated net benefit</span><span className="v est">{lakh(p.net)}</span><span className="faint xs">pays back if it prevents {p.breakeven} failure{p.breakeven>1?"s":""}</span></div>
    </div>
    <div><button className="link sm" onClick={()=>setShowWork(!showWork)} aria-expanded={showWork}>{showWork?"Hide":"Show"} how we worked this out</button></div>
    {showWork && <div className="panel"><div className="receipt">
      <span>Trucks in plan</span><span className="r">{p.n}</span>
      <span>Chance each fails within 90 days without service (model, illustrative)</span><span className="r">45%</span>
      <span>Chance after service (assumption: some risk remains)</span><span className="r">8%</span>
      <span>Failures expected: {p.n} × 45% → {p.n} × 8%</span><span className="r">{p.before.toFixed(1)} → {p.after.toFixed(1)}</span>
      <span>Cost of one failure: ₹38,000 repair and tow + 2 days off the road × ₹8,000</span><span className="r">{inr(FAIL_COST)}</span>
      <span className="tot">Estimated loss avoided ({(p.before-p.after).toFixed(1)} failures × {inr(FAIL_COST)})</span><span className="r tot">{inr(p.avoided)}</span>
      <span>Service, ₹5,000 × {p.n}</span><span className="r">− {inr(p.parts)}</span>
      <span>Revenue lost in a planned half-day, ₹1,000 × {p.n}</span><span className="r">− {inr(p.down)}</span>
      <span className="tot">Estimated net benefit</span><span className="r tot">{inr(p.net)}</span>
      <span>Pays back if it prevents ({inr(p.cost)} ÷ {inr(FAIL_COST)}, rounded up)</span><span className="r">{p.breakeven} failure{p.breakeven>1?"s":""}</span>
    </div><p className="faint xs">Actual spend and failures are measured 90 days after service and shown separately from this estimate.</p></div>}

    <div className="panel flush">
      <div className="ph"><h2>Trucks in this plan</h2><span className="faint sm">{p.n} of 10 included</span></div>
      <div className="tw"><table>
        <thead><tr><th>Truck</th><th>Usual route</th><th>Evidence</th><th>Last data</th><th></th></tr></thead>
        <tbody>{TRUCKS.map(t=>{
          const out = excluded.has(t.id); const isStale = p.staleIds.includes(t.id) || (out && (t.old || (state==="stale"&&t.depot==="Bhiwandi")));
          return <tr key={t.id} className={out?"out":""}>
            <td><b style={{fontWeight:500}}>{t.id}</b></td><td>{t.route}</td>
            <td><Chip tone={t.sig==="Strong"?"ok":"line"}>{t.sig}</Chip></td>
            <td>{isStale ? <Chip tone="stale">{state==="stale"&&t.depot==="Bhiwandi"?"3 h ago":t.seen}</Chip> : <span className="faint">Today {t.seen}</span>}</td>
            <td style={{textAlign:"right"}}>{out
              ? <button className="link sm" onClick={()=>{const s=new Set(excluded); s.delete(t.id); setExcluded(s); log("You",`Added ${t.id} back to the clutch plan`,"")}}>Add back</button>
              : <button className="link sm" onClick={()=>go("exclude:"+t.id)}>Exclude</button>}</td>
          </tr>})}</tbody></table></div>
    </div>

    <div className="row">
      <button className="btn" onClick={()=>go("evidence")}>Check the evidence</button>
      <button className="btn primary" disabled={paused||p.n===0} onClick={()=>go("review")}>Review and approve</button>
      <button className="btn ghost" onClick={()=>go("notnow")}>Not now</button>
    </div>
  </div>;
}

/* ============ Evidence ============ */
function Evidence({state, go, ctx}){
  const {excluded, openAsk} = ctx;
  const p = plan(excluded, state);
  const fresh = p.n - p.staleIds.length;
  return <div className="page">
    <div className="spread">
      <div className="col" style={{gap:8}}>
        <h1>Why we think these trucks need a clutch service</h1>
        <p className="muted">Data as of today 08:40. Model figures are illustrative.</p>
      </div>
      <button className="btn" onClick={openAsk}>Question this</button>
    </div>

    <div className="conclusion">
      <div className="col" style={{gap:4}}><span className="k">Conclusion</span><p className="say s">Early clutch wear on {p.n} trucks is likely.</p><span className="sm muted">Three independent vehicle signals agree, and the same pattern came before 4 failures last quarter.</span></div>
      <div className="col" style={{gap:4}}><span className="k">Main uncertainty</span><p className="sm"><b>We can't see service records from outside garages.</b> A recent clutch job elsewhere would make a truck a false positive.</p><span className="sm muted">Freshness: {fresh} of {p.n} trucks reported this morning{p.staleIds.length?`; ${p.staleIds.length} ha${p.staleIds.length>1?"ve":"s"} older data`:""}.</span></div>
    </div>

    <div className="ledger">
      <div className="lcol">
        <h3>What supports it</h3>
        <div className="ev"><span className="mk sup">+</span><div>Clutch slip events up 3.2× in 30 days on all {p.n} trucks<div className="src">Strong · vehicle data, 30 days</div></div></div>
        <div className="ev"><span className="mk sup">+</span><div>Clutch engages ~180 rpm higher than when new<div className="src">Strong · engine and gearbox signals</div></div></div>
        <div className="ev"><span className="mk sup">+</span><div>The 4 trucks that failed last quarter showed this pattern 5–7 weeks before<div className="src">Moderate · your service history, 4 cases</div></div></div>
        <div className="ev"><span className="mk sup">+</span><div>{p.ghat} of {p.n} trucks climb the Kasara ghat with heavy loads<div className="src">Supporting · trip and route data</div></div></div>
      </div>
      <div className="lcol">
        <h3>What we couldn't see</h3>
        <div className="ev"><span className="mk mis">?</span><div>Service records from outside garages<div className="src">Missing source</div></div></div>
        {p.staleIds.length>0 && <div className="ev"><span className="mk mis">?</span><div>{p.staleIds.join(", ")}: data is {state==="stale"?"3 hours":"a day"} old<div className="src">Freshness</div></div></div>}
        {p.noLoad>0 && <div className="ev"><span className="mk mis">?</span><div>No load sensor on {p.noLoad} truck{p.noLoad>1?"s":""}; loads estimated from weight slips<div className="src">Partial data</div></div></div>}
      </div>
      <div className="lcol">
        <h3>Other explanations we checked</h3>
        <div className="ev"><span className="mk alt">~</span><div><b style={{fontWeight:500}}>Operator technique.</b> Less likely: on {p.multi} of {p.n} trucks the pattern continues across 2 or more operators.</div></div>
        <div className="ev"><span className="mk alt">~</span><div><b style={{fontWeight:500}}>Sensor fault.</b> Unlikely: three independent signals agree.</div></div>
        <div className="ev"><span className="mk alt">~</span><div><b style={{fontWeight:500}}>Overloading.</b> Contributes on {p.over} trucks, but doesn't explain the other {p.n-p.over}.</div></div>
      </div>
    </div>

    <div className="panel">
      <div className="spread"><h2>Not convinced? Change the plan</h2><span className="faint sm">Your reason is logged and used to improve future proposals</span></div>
      <div className="row">
        <button className="btn" onClick={()=>go("exclude:"+(p.list[0]?.id||""))} disabled={!p.n}>Exclude a truck</button>
        <button className="btn" onClick={openAsk}>Ask why these trucks and not the other 18</button>
        <button className="btn ghost" onClick={()=>go("notnow")}>Disagree with the whole proposal</button>
      </div>
      {excluded.size>0 && <div className="notice info"><b>Plan updated.</b><span>{p.n} trucks · cost {inr(p.cost)} · estimated net benefit {lakh(p.net)}. Rahul Patil has been asked to upload the outside service record so this doesn't come up again.</span></div>}
    </div>
    <div className="row"><button className="btn" onClick={()=>go("proposal")}>Back to the proposal</button><button className="btn primary" disabled={!p.n || (state==="stale"&&p.staleIds.length>0)} onClick={()=>go("review")}>Review and approve</button></div>
  </div>;
}

/* ============ Review ============ */
function Review({state, go, ctx}){
  const {excluded, approve, toast} = ctx;
  const p = plan(excluded, state);
  const [notify, setNotify] = useState(true);
  const [cmp, setCmp] = useState(false);
  const [vendor, setVendor] = useState(0);
  const v = VENDORS[vendor];
  const pay = p.n*v.price;
  const paused = state==="stale" && p.staleIds.length>0;
  return <div className="page">
    <div className="col" style={{gap:8}}><h1>Review before you approve</h1><p className="muted">Exactly what happens, who owns it, and what it costs.</p></div>
    {paused && <div className="notice warn"><span><b>Approval paused:</b> {p.staleIds.length} trucks have stale data. <button className="link" onClick={()=>go("proposal")}>Back to the plan</button></span></div>}
    <div className="grid2">
      <div className="panel flush">
        <div className="ph"><h2>Schedule</h2><span className="faint sm">Each truck's quietest day</span></div>
        {p.list.map(t=><div key={t.id} className="item"><div><div className="t">{t.id}</div><div className="m">{t.route}</div></div><div className="n"><span className="sm">{t.slot}</span><span className="faint xs">About 4 h at {v.n.split(",")[0]}</span></div></div>)}
      </div>
      <div className="col">
        <div className="panel">
          <h2>Spend</h2>
          <div className="receipt">
            <span>Service, parts and labour ({p.n} × {inr(v.price)})</span><span className="r">{inr(pay)}</span>
            <span className="faint">Revenue lost in planned downtime (not a payment)</span><span className="r faint">{inr(p.down)}</span>
            <span className="tot">You're approving a payment of</span><span className="r tot">{inr(pay)}</span>
          </div>
          <div className={"notice sm "+(pay<=50000?"ok":"warn")}><span>{pay<=50000?"Within your approval limit of ₹50,000. Above Rahul's ₹10,000 limit, so it needs you.":"Above your ₹50,000 limit. This will go to the owner for approval."}</span></div>
        </div>
        <div className="panel">
          <h2>Who and how</h2>
          <dl className="kv">
            <dt>Owner</dt><dd>Rahul Patil, Maintenance lead. Confirms each slot with the vendor.</dd>
            <dt>Vendor</dt><dd>{v.n} · {v.rating}<br/><button className="link sm" aria-expanded={cmp} onClick={()=>setCmp(!cmp)}>{cmp?"Hide comparison":"Compare 3 vendors"}</button></dd>
            <dt>Notifications</dt><dd><label className="row sm" style={{cursor:"pointer",gap:8}}><input type="checkbox" id="notify-ops" checked={notify} onChange={e=>setNotify(e.target.checked)}/>Tell the {p.n} operators their service day</label></dd>
          </dl>
          {cmp && <div className="tw"><table className="vt"><thead><tr><th></th><th>Vendor</th><th>Per truck</th><th>Availability</th></tr></thead><tbody>
            {VENDORS.map((x,i)=><tr key={i}><td><input type="radio" name="vendor" id={"vendor-"+i} checked={vendor===i} onChange={()=>setVendor(i)} aria-label={x.n}/></td><td>{x.n}<div className="faint xs">{x.rating}</div></td><td>{inr(x.price)}</td><td>{x.slots}</td></tr>)}
          </tbody></table></div>}
        </div>
        <div className="notice info sm"><span>You can cancel any slot until the vendor confirms it, usually within 2 hours. Once work starts it can't be undone; you can raise an issue with the vendor instead.</span></div>
        <div className="row"><button className="btn primary" disabled={paused||!p.n} onClick={()=>approve(pay, notify, v.n)}>Approve {inr(pay)} and schedule</button><button className="btn ghost" onClick={()=>go("proposal")}>Back</button></div>
      </div>
    </div>
  </div>;
}

/* ============ Track ============ */
function Track({state, go, ctx}){
  const {excluded, when, setWhen, failed, setFailed, toast, confirmed, cancelled, setCancelled, log, approval} = ctx;
  const p = plan(excluded, state);
  const active = p.list.filter(t=>!cancelled.has(t.id));
  const failTruck = (active.find(t=>t.depot==="Bhiwandi")||active[0]||{}).id;
  const nA = active.length;
  const spend = approval ? nA*approval.price : nA*PARTS;
  const chip = when==="d90" ? <Chip tone="ok">Completed · outcome checked</Chip> : when==="d4" ? <Chip tone="info">In progress</Chip> : <Chip tone={confirmed?"info":"warn"}>{confirmed?"Scheduled":"Waiting for vendor"}</Chip>;
  const d4done = failed ? nA-2 : nA-1;
  const steps = [
    {k:"Approved", s:"Thu 8 Oct, by you", c:"done"},
    {k:"Scheduled", s: when==="now" ? (confirmed?`${nA} of ${nA} slots confirmed`:`0 of ${nA} confirmed · Rahul is confirming`) : `${nA} slots booked`, c: when==="now"&&!confirmed?"now":"done"},
    {k:"In service", s: when==="now"?"Starts Fri 9 Oct": when==="d4" ? `${Math.max(d4done,0)} done, 1 in service${failed?", 1 slot cancelled":""}` : "All done", c: when==="now"?"":when==="d4"?(failed?"fail":"now"):"done"},
    {k:"Completed", s: when==="d90"?"Tue 13 Oct":"—", c: when==="d90"?"done":""},
    {k:"Outcome checked", s: when==="d90"?"Checked 11 Jan":"Due 11 Jan", c: when==="d90"?"done":""},
  ];
  return <div className="page">
    <div className="spread">
      <div className="col" style={{gap:8}}><div className="row">{chip}<span className="faint sm">Approved by you, Thu 8 Oct</span></div><h1>Clutch service, {nA} trucks</h1></div>
      <div className="col" style={{gap:6,alignItems:"flex-end"}}><span className="faint xs">See this plan</span>
        <div className="seg" role="group" aria-label="Point in time">
          <button aria-pressed={when==="now"} onClick={()=>setWhen("now")}>Today</button>
          <button aria-pressed={when==="d4"} onClick={()=>setWhen("d4")}>In 5 days</button>
          <button aria-pressed={when==="d90"} onClick={()=>setWhen("d90")}>In 90 days</button>
        </div></div>
    </div>
    <div className="steps">{steps.map(s=><div key={s.k} className={"step "+s.c}><b>{s.k}</b><span>{s.s}</span></div>)}</div>

    {when==="d4" && failed && <div className="notice crit"><div className="col" style={{gap:8}}>
      <span><b>Sai Auto Works cancelled the slot for {failTruck}</b> (mechanic unavailable). Nothing was charged.</span>
      <div className="row"><button className="btn sm primary" onClick={()=>{setFailed(false); log("You",`Rebooked ${failTruck}: Mon 12 Oct 14:00 at Om Motors`,"Vendor cancelled original slot"); toast("Rebooked: Mon 12 Oct 14:00 at Om Motors. Rahul has been told.")}}>Rebook Mon 12 Oct 14:00, Om Motors</button>
      <button className="btn sm" onClick={()=>toast("Other options: Shree Garage Tue 13 Oct 15:00, or Sai Auto Works Wed 14 Oct 09:00.")}>Other options</button></div>
    </div></div>}

    {when==="d90" ? <div className="grid2">
      <div className="panel">
        <h2>What happened</h2>
        <p className="say s">No clutch failures in this group in 90 days. Without the service we expected about {(nA*P_BEFORE).toFixed(1)}.</p>
        <div className="receipt">
          <span>Approved payment</span><span className="r">{inr(spend)}</span>
          <span>Actual spend (one truck needed a pressure plate)</span><span className="r">{inr(spend+2300)}</span>
          <span>Clutch failures observed</span><span className="r">0</span>
          <span className="tot">Estimated loss avoided</span><span className="r tot est">{lakh((nA*(P_BEFORE-P_AFTER))*FAIL_COST)}</span>
        </div>
        <p className="faint xs">Loss avoided is an estimate from what similar trucks did. Actual spend comes from vendor invoices.</p>
      </div>
      <div className="panel">
        <h2>You've approved 5 proposals like this one</h2>
        <p className="muted sm">All were clutch or brake wear on 3 or more trucks of one model, under ₹50,000. You could let SuprFleet prepare or book these within limits you set. Test it on past cases first.</p>
        <div><button className="btn primary" onClick={()=>go("rule")}>Try an automation rule</button></div>
      </div>
    </div> :
    <div className="panel flush">
      <div className="ph"><h2>Trucks</h2><span className="faint sm">Owner: Rahul Patil</span></div>
      {p.list.map((t,i)=>{
        const isCx = cancelled.has(t.id);
        let st;
        if(isCx) st = <Chip tone="stale">Cancelled by you · no charge</Chip>;
        else if(when==="now") st = <Chip tone={confirmed?"info":"warn"}>{confirmed?`Confirmed · ${t.slot}`:`Waiting · ${t.slot}`}</Chip>;
        else { const lastActive = active[active.length-1]?.id; st = (t.id===failTruck && failed) ? <Chip tone="crit">Slot cancelled by vendor</Chip> : t.id===lastActive ? <Chip tone="warn">In service</Chip> : <Chip tone="ok">Completed</Chip>; }
        return <div key={t.id} className="item"><div><div className="t">{t.id}</div><div className="m">{t.route}</div></div>
          <div className="n">{st}{when==="now" && !isCx && <button className="link xs" onClick={()=>{const s=new Set(cancelled); s.add(t.id); setCancelled(s); log("You",`Cancelled service slot for ${t.id}`,"Before work started · no charge"); toast(`Slot for ${t.id} cancelled. No charge.`)}}>Cancel slot</button>}</div></div>})}
    </div>}
  </div>;
}

/* ============ Automation rule ============ */
function RuleScreen({go, ctx}){
  const {toast, rules, setRules, log} = ctx;
  const [tested, setTested] = useState(0);   // 0 none, 1 first test, 2 retest with correction
  const [mode, setMode] = useState(null);
  const cases = tested===2
    ? [["m","2 Apr"],["m","9 May"],["x2","2 Jul"],["m","30 Jul"],["s","18 Aug"],["m","3 Sep"],["m","24 Sep"]]
    : [["m","2 Apr"],["m","9 May"],["r","2 Jul"],["m","30 Jul"],["s","18 Aug"],["m","3 Sep"],["m","24 Sep"]];
  const tone = {m:"ok", r:"warn", s:"stale", x2:"line"};
  const label = {m:"Would run · matches your decision", r:"Would run · you rejected it", s:"Skipped · data was stale", x2:"Now excluded · trucks marked for sale"};
  return <div className="page">
    <div className="col" style={{gap:8}}><h1>New automation rule</h1><p className="muted">Narrow on purpose. Test it on the last 6 months before it does anything.</p></div>
    <div className="panel">
      <p className="rule">When <span className="tok">3 or more trucks of the same model</span> show <span className="tok">clutch or brake wear</span> with <span className="tok">strong evidence</span>, and the service costs <span className="tok">under ₹50,000</span> in total, <span className="tok">book the preferred vendor on each truck's quietest day</span>{tested===2 && <> and <span className="tok">skip trucks marked for sale</span></>}.</p>
      <p className="sm muted">This rule can never: <span className="tok lock">control a vehicle</span> <span className="tok lock">change routes</span> <span className="tok lock">spend above ₹50,000</span> <span className="tok lock">act on safety cases</span></p>
      <div className="notice info sm"><span><b>Spending limit.</b> Rules can spend ₹5,000 per action by default. This rule asks for ₹50,000, for this rule only. That's the same as your own approval limit, so it can't approve more than you could.</span></div>
      <div className="row"><button className="btn primary" onClick={()=>setTested(1)} disabled={tested>0}>Test on the last 6 months</button></div>
    </div>
    {tested>0 && <div className="panel">
      <div className="spread"><h2>7 past cases evaluated</h2><span className="faint sm">Apr – Sep 2026</span></div>
      <div className="col" style={{gap:0}}>{cases.map(([k,d],i)=><div key={i} className="item" style={{padding:"9px 0"}}><div className="sm">{d}</div><div className="n"><Chip tone={tone[k]}>{label[k]}</Chip></div></div>)}</div>
      {tested===1 && <div className="notice warn"><div className="col" style={{gap:8}}><span><b>The case you rejected, 2 Jul:</b> those trucks were about to be sold. Suggested change: skip trucks marked for sale.</span><div><button className="btn sm" onClick={()=>setTested(2)}>Add this and test again</button></div></div></div>}
      {tested===2 && <div className="notice ok sm"><span>After the change: 5 would run, all match your decisions. 1 is now excluded. 1 is still skipped because its data was stale, which is the safe outcome.</span></div>}
      <div className="receipt"><span>Spend it would have booked</span><span className="r">₹1,75,000</span><span>Estimated loss avoided (illustrative)</span><span className="r est">₹6,90,000</span></div>
      {tested===2 && <>
      <h3 style={{marginTop:6}}>How should it run?</h3>
      <div className="radio">
        <label><input type="radio" name="mode" id="mode-ask" checked={mode==="ask"} onChange={()=>setMode("ask")}/><span><b>Ask me first.</b> <span className="muted">It prepares the booking; you approve in one tap. (Advisor plan)</span></span></label>
        <label><input type="radio" name="mode" id="mode-act" checked={mode==="act"} onChange={()=>setMode("act")}/><span><b>Book it and tell me.</b> <span className="muted">You can cancel until the vendor confirms (about 2 hours). (Delegate plan)</span></span></label>
      </div>
      <div className="row"><button className="btn primary" disabled={!mode} onClick={()=>{
        setRules(rules.map(r=>r.id==="clutch"?{...r,status:"On",mode:mode==="ask"?"Asks you first":"Books and tells you"}:r));
        log("You",`Turned on rule: clutch and brake service under ₹50,000 (${mode==="ask"?"asks first":"books and tells"})`,"Tested on 7 past cases");
        toast("Rule turned on."); go("rules")}}>Turn on rule</button>
        <button className="btn ghost" onClick={()=>{toast("Saved as draft."); go("rules")}}>Save as draft</button></div></>}
    </div>}
  </div>;
}

  {t:"Flooding at Bhiwandi: reroute 23 deliveries via Thane", m:"+₹18,000 fuel, about +1.5 h. Keeps 9 sites supplied today", v:"₹4.1 L of deliveries", when:"By 11:00", expand:true},

];

  return <div className="page">
    <div className="col" style={{gap:6}}><h1>Needs your decision</h1><p className="muted">{dense?"62 issues today, grouped into 7 causes. Safety first, then by deadline.":"Safety first, then by deadline. Improvements for the week below."}</p></div>
    <div className="urgent"><span className="ic" aria-hidden="true">!</span><div><b>Unexplained fuel loss, MH12-AB-1234.</b> <span className="muted">{m.escalated?"Escalated to Arjun Nair, waiting for acknowledgement.":"Not acknowledged by Sunita Rao for 6 h 28 min."}</span></div><button className="btn sm" onClick={()=>go("theft")}>Review evidence</button></div>

        <div className="grid2" style={{gap:14}}>
          <dl className="kv">
            <dt>Grouped from</dt><dd>31 alerts: trucks stationary over 2 h, 3 depot water-level sensors, NH-48 closure notice</dd>
            <dt>Affected</dt><dd>72 trucks at Bhiwandi. 23 carry material sites need today; 49 have no urgent load</dd>
            <dt>Exception</dt><dd>4 trucks with cement for site 12 can't wait for a reroute. Shown separately to Priya Shah</dd>

        </div>
        {m.reroute ? <div className="notice ok sm"><span>Approved at 08:47. Priya is sending new routes; 0 of 23 confirmed so far.</span></div>

      </div>}

        {[["8 deliveries short of a truck or driver","5 failed morning checks, 3 drivers unavailable","Before 09:30","today"],["3 sites low on generator fuel","Tanker refuel ₹18,400","Before 10:00","today"]].map((r,i)=><button key={i} className="item button" onClick={()=>go(r[3])}><div><div className="t">{r[0]}</div><div className="m">{r[1]}</div></div><div className="n"><span className="faint xs">{r[2]}</span></div></button>)}</div>
      <div className="panel flush"><div className="ph"><h2>This week</h2></div>

    </>}

}

        <button className="btn ghost" disabled={m.falseAlarm} onClick={()=>{setM({...m,falseAlarm:true}); log("You","Marked fuel-loss case as false alarm","Sensor to be checked")}}>Mark as false alarm</button>
      </div>
      <label className="sm muted" htmlFor="theft-note">Note for the safety team</label>
      <textarea id="theft-note" value={note} onChange={e=>setNote(e.target.value)} placeholder="What should Sunita or Arjun know?"/>
      <div><button className="btn sm" disabled={!note.trim()} onClick={()=>{log("You","Added a note to the fuel-loss case",note.slice(0,60)); setNote(""); toast("Note added to the case.")}}>Add note</button></div>
      <p className="out-note">Vehicle-control actions, like immobilising, are outside this prototype.</p>
    </div>
  </div>;
}

function Assets({ctx, state}){
  return <div className="page"><h1>Assets</h1>
    <div className="panel"><div className="mix">{MIX.map(m=><span key={m.k} style={{flex:m.n,background:m.c}}/>)}</div><div className="legend">{MIX.map(m=><span key={m.k}><i className="dot" style={{background:m.c}}/>{m.k} {m.n}</span>)}</div></div>
    <div className="panel flush"><div className="ph"><h2>Can't verify today</h2><span className="faint sm">{state==="stale"?"140 assets":"23 assets"}</span></div>
      {(state==="stale"?[["140 assets at Bhiwandi","Network outage since 05:40","Data will sync when the network returns"]]:[["14 trucks","Kasara ghat low-network corridor (6 have deliveries today)","Will sync when back in coverage"],["6 generators","Nashik site power cut since 04:00 (2 sites affected)","Check after power returns"],["3 devices","No data for 2 days","Field visit needed"]]).map((r,i)=><div key={i} className="item"><div><div className="t">{r[0]}</div><div className="m">{r[1]}</div></div><div className="n"><span className="sm muted">{r[2]}</span></div></div>)}</div>
    <p className="out-note">Asset detail pages are outside this prototype.</p></div>;
}
function Rules({ctx}){
  const {rules} = ctx;
  return <div className="page"><h1>Automation rules</h1>
    <p className="muted">What SuprFleet may do on its own, and its limits. Safety cases always go to a person.</p>
    <div className="panel flush">{rules.map(r=><div key={r.id} className="item"><div><div className="t">{r.t}</div><div className="m">{r.m}{r.mode?` · ${r.mode}`:""} · limit {r.limit}</div></div><div className="n"><Chip tone={r.status==="On"?"ok":"line"}>{r.status}</Chip></div></div>)}</div>
    <div className="panel"><h2>Your limits</h2><div className="receipt">
      <span>You can approve up to</span><span className="r">₹50,000</span>
      <span>Rahul Patil (Maintenance) up to</span><span className="r">₹10,000</span>
      <span>Rules can spend per action, by default</span><span className="r">₹5,000</span>
      <span>Highest limit any rule can be given</span><span className="r">₹50,000 (your limit)</span>
      <span>Urgent issues at night go to</span><span className="r">Sunita Rao, then Arjun Nair at 08:45</span>
    </div></div></div>;
}
function Activity({ctx}){
  return <div className="page"><h1>Activity</h1><p className="muted">Everything people and rules did, with the reason. Newest first.</p>
    <div className="panel flush">{ctx.activity.map((r,i)=><div key={i} className="item"><div><div className="t">{r.what}</div><div className="m">{r.who}{r.why?` · ${r.why}`:""}</div></div><div className="n"><span className="faint sm">{r.time}</span></div></div>)}</div></div>;
}

/* ============ Ask layer ============ */
const ANSWERS = [
  {q:"Why these trucks and not the other 18 of this model?", scope:"28 Tata Signa 4825 trucks, last 30 days", say:"The other 18 don't show the slip pattern yet. Most run flat routes with lighter loads.",
   bars:[["Trucks in this plan",100,"3.2×"],["Other 18",34,"1.1×"]], note:"Slip events against each truck's own baseline. Sources: vehicle data, trip data.", act:"Back to the proposal"},
  {q:"Why is fuel cost up 8% this month?", scope:"All trucks, September vs August", say:"Most of the 8% is idling at Bhiwandi while trucks wait for loading.",
   bars:[["Idling at Bhiwandi",62,"62%"],["Ghat route loads",23,"23%"],["Diesel price",15,"15%"]], note:"Sources: fuel sensors, trip data, fuel card prices.", act:null},
  {q:"Which site lost the most revenue this week?", scope:"38 construction sites, Mon–Thu", say:"Site 19 at Nashik: about ₹1.2 lakh, mostly from generator downtime during the power cut.",
   bars:[["Site 19, Nashik",100,"₹1.2 L"],["Site 27, Nashik",58,"₹70k"],["Site 4, Chakan",21,"₹25k"]], note:"Estimated from billed site hours lost. Sources: generator run hours, site schedule.", act:null},
];
function Ask({close, toast}){
  const [a, setA] = useState(null); const [typed, setTyped] = useState(false); const [text, setText] = useState("");
  const ans = a!=null ? ANSWERS[a] : null;
  return <><div className="scrim" onClick={close}/>
  <aside className="ask" aria-label="Ask about your fleet">
    <header><h2>Ask about your fleet</h2><button className="btn ghost sm" onClick={close}>Close</button></header>
    <div className="body">
      <input id="ask-input" value={text} onChange={e=>setText(e.target.value)} placeholder="Ask a question in your words" onKeyDown={e=>{if(e.key==="Enter"&&text.trim()){setA(null);setTyped(true)}}}/>
      {typed && !ans && <div className="notice stale sm"><span>In this prototype, Ask answers the suggested questions below. In the product, any question about your fleet's data works.</span></div>}
      {!ans && <div className="sugg"><span className="faint xs">Suggested from today's issues</span>{ANSWERS.map((x,i)=><button key={i} onClick={()=>{setA(i);setTyped(false)}}>{x.q}</button>)}</div>}
      {ans && <div className="answer">
        <span className="faint xs">Answer · {ans.scope}</span>
        <p className="say s">{ans.say}</p>
        <div className="bars">{ans.bars.map((b,i)=><div key={i}><span>{b[0]}</span><span className="b" style={{width:b[1]+"%",background:i?"var(--ink3)":"var(--accent)"}}/><span>{b[2]}</span></div>)}</div>
        <p className="faint xs">{ans.note}</p>
        <div className="row">{ans.act && <button className="btn sm" onClick={close}>{ans.act}</button>}<button className="btn sm ghost" onClick={()=>setA(null)}>Ask something else</button></div>
      </div>}
    </div>
  </aside></>;
}

/* ============ App ============ */
const STORY = [["today","1 Today"],["proposal","2 Proposal"],["evidence","3 Evidence"],["review","4 Approve"],["track","5 Track"],["rule","6 Automation"]];
const NAV = [["today","Today"],["decisions","Needs your decision"],["assets","Assets"],["rules","Automation rules"],["activity","Activity"]];
const TITLES = {today:"Today",proposal:"Proposal",evidence:"Evidence",review:"Review and approve",track:"Clutch service",rule:"New automation rule",decisions:"Needs your decision",assets:"Assets",rules:"Automation rules",activity:"Activity",theft:"Urgent case"};
const PARENT = {proposal:"decisions",evidence:"proposal",review:"proposal",track:"decisions",rule:"rules",theft:"decisions"};
const RULES0 = [
  {id:"clean", t:"Book panel cleaning under ₹5,000", m:"Solar stations · books and tells you", status:"On", limit:"₹5,000"},
  {id:"idle", t:"Tell operators when idling passes 45 min", m:"Trucks · no cost", status:"On", limit:"₹0"},
  {id:"temp", t:"Raise a ticket for inverter temperature alerts", m:"Inverters · no cost", status:"On", limit:"₹0"},
  {id:"clutch", t:"Clutch and brake service under ₹50,000", m:"Trucks · tested on 7 past cases", status:"Draft", limit:"₹50,000 (this rule only)"},
];
const ACT0 = [
  {time:"02:12", who:"Rule", what:"Alerted Sunita Rao about unexplained fuel loss on MH12-AB-1234", why:"Safety cases always go to a person"},
  {time:"21:40", who:"Rule", what:"Told 4 operators about idling at Bhiwandi", why:"Rule: idling over 45 min"},
  {time:"20:05", who:"Rule", what:"Booked panel cleaning for SOL-07, ₹1,800", why:"Rule: cleaning under ₹5,000"},
  {time:"18:30", who:"Rahul Patil", what:"Raised ticket for INV-022", why:"Temperature above limit"},
];

function App(){
  const [screen, setScreen] = useState("today");
  const [state, setState] = useState("normal");
  const [excluded, setExcluded] = useState(new Set());
  const [askOpen, setAskOpen] = useState(false);
  const [modal, setModal] = useState(null);
  const [toastMsg, setToastMsg] = useState(null);
  const [when, setWhen] = useState("now");
  const [failed, setFailed] = useState(true);
  const [reason, setReason] = useState("serviced");
  const [nn, setNn] = useState("later"); const [nnWhy, setNnWhy] = useState("");
  const [m, setM] = useState({});
  const [pstatus, setPstatus] = useState("open");
  const [confirmed, setConfirmed] = useState(false);
  const [cancelled, setCancelled] = useState(new Set());
  const [rules, setRules] = useState(RULES0);
  const [activity, setActivity] = useState(ACT0);
  const [approval, setApproval] = useState(null);
  const [narrow, setNarrow] = useState(()=>window.matchMedia("(max-width:760px)").matches);
  const log = (who, what, why) => setActivity(a=>[{time:"08:"+String(Math.min(59,44+a.length-ACT0.length)).padStart(2,"0"), who, what, why}, ...a]);

  useEffect(()=>{ const mq=window.matchMedia("(max-width:760px)"); const f=()=>setNarrow(mq.matches); mq.addEventListener("change",f); return ()=>mq.removeEventListener("change",f)},[]);
  useEffect(()=>{ const k=e=>{ if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){e.preventDefault();setAskOpen(true)} if(e.key==="Escape"){setAskOpen(false);setModal(null)} }; window.addEventListener("keydown",k); return ()=>window.removeEventListener("keydown",k)},[]);
  useEffect(()=>{ if(!toastMsg) return; const t=setTimeout(()=>setToastMsg(null),3400); return ()=>clearTimeout(t)},[toastMsg]);
  useEffect(()=>{ if(state==="failed"){setWhen("d4");setFailed(true)} },[state]);
  useEffect(()=>{ if(screen==="track" && when==="now" && !confirmed){ const t=setTimeout(()=>setConfirmed(true),2800); return ()=>clearTimeout(t)} },[screen,when,confirmed]);

  const go = (to)=>{
    if(to==="ask") return setAskOpen(true);
    if(to==="notnow") return setModal({type:"notnow"});
    if(to.startsWith("exclude:")) return setModal({type:"exclude", id:to.split(":")[1]});
    setScreen(to); window.scrollTo({top:0});
  };
  const toast = msg=>setToastMsg(msg);
  const approve = (pay, notify, vendorName)=>{
    const p=plan(excluded,state);
    setApproval({price: pay/p.n, vendor: vendorName}); setPstatus("approved"); setConfirmed(false); setWhen("now"); setScreen("track"); window.scrollTo({top:0});
    log("You",`Approved ${inr(pay)} clutch service for ${p.n} trucks`,`${vendorName.split(",")[0]}${notify?" · operators told":""}`);
    toast("Approved. Rahul Patil is confirming slots with the vendor.");
  };
  const ctx = {excluded, setExcluded, openAsk:()=>setAskOpen(true), toast, log, m, setM, narrow, pstatus, when, setWhen, failed, setFailed, confirmed, cancelled, setCancelled, rules, setRules, activity, approve, approval};
  const p = plan(excluded, state);
  const decCount = state==="empty"||state==="loading" ? 0 : state==="dense" ? 7 : 2 + improvements(p,ctx).length - (pstatus==="approved"||pstatus==="dismissed"?1:0);
  const navKey = PARENT[screen] && !NAV.find(n=>n[0]===screen) ? PARENT[screen] : screen;

  const S = {today:Today, proposal:Proposal, evidence:Evidence, review:Review, track:Track, rule:RuleScreen, decisions:Decisions, theft:Theft, assets:Assets, rules:Rules, activity:Activity}[screen];

  return <div className="app">
    <nav className="rail" aria-label="Main">
      <div className="brand"><i/>SuprFleet</div>
      {NAV.map(([k,l])=><button key={k} className="nav" aria-current={navKey===k?"page":undefined} onClick={()=>go(k)}>{l}{k==="decisions" && decCount>0 && <span className="count">{decCount}</span>}</button>)}
      <div className="who"><b>Vikram Deshmukh</b>Head of Operations<br/>{COMPANY}<br/>500 assets · 38 sites</div>
    </nav>
    <div className="main">
      <div className="top">
        <div className="crumbs">{PARENT[screen] && <><button onClick={()=>go(PARENT[screen])}>{TITLES[PARENT[screen]]}</button><span>/</span></>}<span style={{color:"var(--ink)"}}>{TITLES[screen]}</span></div>
        <span className={"fresh"+(state==="stale"?" bad":"")}>{state==="stale"?"140 assets 3 h behind":state==="empty"?"Connecting…":state==="loading"?"Loading…":"Updated 08:40 · 477 of 500 reporting"}</span>
        <button className="askbtn" onClick={()=>setAskOpen(true)}>Ask about your fleet<kbd>⌘K</kbd></button>
      </div>
      <S state={state} go={go} ctx={ctx}/>
    </div>

    {askOpen && <Ask close={()=>setAskOpen(false)} toast={toast}/>}

    {modal && <div className="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div className="scrim" onClick={()=>setModal(null)}/>
      <div className="box" style={{position:"relative",zIndex:26}}>
        {modal.type==="exclude" ? <>
          <h2 id="modal-title">Exclude a truck from the plan</h2>
          <label className="sm muted" htmlFor="exclude-id">Truck</label>
          <select id="exclude-id" value={modal.id} onChange={e=>setModal({...modal,id:e.target.value})} style={{padding:"8px",borderRadius:6,border:"1px solid var(--line2)",background:"var(--paper)",color:"var(--ink)",font:"inherit"}}>
            {TRUCKS.filter(t=>!excluded.has(t.id)).map(t=><option key={t.id} value={t.id}>{t.id} · {t.route}</option>)}
          </select>
          <p className="muted sm">Why? It updates this plan and improves future proposals.</p>
          <div className="radio">
            {[["serviced","Clutch was serviced recently at an outside garage"],["sale","Truck is about to be sold or retired"],["other","Something else"]].map(([v,l])=><label key={v}><input type="radio" name="reason" id={"reason-"+v} checked={reason===v} onChange={()=>setReason(v)}/><span>{l}</span></label>)}
          </div>
          {reason==="other" && <textarea id="reason-text" placeholder="What should we know?"/>}
          <div className="row"><button className="btn primary" onClick={()=>{const s=new Set(excluded); s.add(modal.id); setExcluded(s); setModal(null); const q=plan(s,state);
            log("You",`Excluded ${modal.id} from the clutch plan`,reason==="serviced"?"Serviced at an outside garage":reason==="sale"?"About to be sold":"Other reason");
            toast(`Plan updated: ${q.n} trucks, est. net ${lakh(q.net)}.`)}}>Exclude and update plan</button><button className="btn ghost" onClick={()=>setModal(null)}>Keep it in</button></div>
        </> : <>
          <h2 id="modal-title">Not now</h2>
          <p className="muted sm">If you wait past Friday, this week's quiet slots are lost.</p>
          <div className="radio">
            <label><input type="radio" name="nn" id="nn-later" checked={nn==="later"} onChange={()=>setNn("later")}/><span><b>Remind me Monday 12 Oct.</b> <span className="muted">We'll bring it back with fresh data.</span></span></label>
            <label><input type="radio" name="nn" id="nn-disagree" checked={nn==="disagree"} onChange={()=>setNn("disagree")}/><span><b>I disagree with this proposal.</b> <span className="muted">It won't come back unless the evidence changes.</span></span></label>
          </div>
          {nn==="disagree" && <textarea id="nn-why" value={nnWhy} onChange={e=>setNnWhy(e.target.value)} placeholder="Why? For example: these trucks are being replaced next month."/>}
          <div className="row"><button className="btn primary" disabled={nn==="disagree"&&!nnWhy.trim()} onClick={()=>{setModal(null);
            if(nn==="later"){setPstatus("snoozed"); log("You","Snoozed clutch proposal until Mon 12 Oct",""); toast("We'll bring this back on Monday 12 Oct.")}
            else {setPstatus("dismissed"); log("You","Disagreed with clutch proposal",nnWhy.slice(0,60)); setNnWhy(""); toast("Recorded. It won't come back unless the evidence changes.")}}}>Confirm</button><button className="btn ghost" onClick={()=>setModal(null)}>Cancel</button></div>
        </>}
      </div></div>}

    {toastMsg && <div className="toast" role="status">{toastMsg}</div>}

    <div className="demo" aria-label="Prototype controls">
      <span className="lbl">Story</span>
      {STORY.map(([k,l])=><button key={k} aria-pressed={screen===k} onClick={()=>{ if(k==="track"){setWhen("now"); if(pstatus!=="approved"){setPstatus("approved")}} go(k)}}>{l}</button>)}
      <span className="sep"/>
      <span className="lbl">State</span>
      <select id="demo-state" value={state} onChange={e=>{setState(e.target.value); setScreen(e.target.value==="failed"?"track":"today")}} aria-label="Demo state">
        <option value="normal">Normal day</option><option value="loading">Loading</option><option value="empty">New account</option>
        <option value="stale">Stale data</option><option value="failed">Action failed</option><option value="dense">Dense day (500 assets)</option>
      </select>
    </div>
  </div>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
